<style>
  :root{
    --bg:#f6f4ee; --panel:#ffffff; --ink:#1e2a23; --muted:#6b7a70;
    --green:#1e5c40; --green-dark:#143f2c; --green-soft:#e4efe8;
    --amber:#d98324; --amber-soft:#fbeedb;
    --red:#b03a2e; --red-soft:#f7e2df;
    --blue:#2b6cb0; --blue-soft:#e2ecf7;
    --border:#e2ded2; --shadow:0 2px 10px rgba(30,42,35,.07);
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);font-size:15px}
  .sans{font-family:'Segoe UI',system-ui,sans-serif}
  button,input,select,textarea{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
  .hidden{display:none!important}

  /* Pricing simulator */
  .pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:16px}
  @media(max-width:900px){.pr-grid{grid-template-columns:1fr}}
  .pr-slider{margin-bottom:18px}
  .pr-slider .pr-lbl{display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Segoe UI',sans-serif;font-size:13px;color:var(--muted);margin-bottom:5px}
  .pr-slider .pr-lbl b{font-size:17px;color:var(--ink);font-family:Georgia,serif}
  .pr-slider input[type=range]{width:100%;accent-color:var(--green);height:22px;cursor:pointer}
  .pr-hint,.pr-track-notes{font-family:'Segoe UI',sans-serif;font-size:11.5px;color:var(--muted);margin-top:2px}
  .pr-figs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pr-fig{background:var(--green-soft);border-radius:10px;padding:11px 13px}
  .pr-fig.wide{grid-column:1/-1;background:var(--bg);border:1px solid var(--border)}
  .pr-fig .lbl{font-family:'Segoe UI',sans-serif;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.6px}
  .pr-fig .val{font-size:22px;font-weight:bold;margin-top:2px}
  .pr-fig .note{font-family:'Segoe UI',sans-serif;font-size:11.5px;color:var(--muted);margin-top:1px}

  /* ---------- Lock screen ---------- */
  #lockScreen{position:fixed;inset:0;background:linear-gradient(160deg,#143f2c 0%,#1e5c40 60%,#2a7350 100%);display:flex;align-items:center;justify-content:center;z-index:100}
  .lock-card{background:var(--panel);border-radius:16px;padding:42px 46px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
  .lock-card h1{font-size:26px;margin-bottom:4px;color:var(--green-dark)}
  .lock-logo{width:100%;max-width:240px;height:auto;display:block;margin:0 auto 14px}
  .lock-card .sub{color:var(--muted);margin-bottom:26px;font-style:italic}
  .lock-card input[type=password]{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px}
  .lock-err{color:var(--red);font-size:13px;margin-bottom:10px;min-height:16px}
  .remember-row{display:flex;align-items:center;gap:8px;justify-content:center;margin:6px 0 16px;font-size:13px;color:var(--muted);font-family:'Segoe UI',sans-serif}

  /* ---------- Layout ---------- */
  #app{display:flex;min-height:100vh}
  aside{width:225px;background:var(--green-dark);color:#e9f2ec;padding:26px 0;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0}
  .logo{padding:0 24px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:16px}
  .side-logo{width:100%;max-width:170px;height:auto;display:block;margin-bottom:9px}
  .logo .name{font-size:19px;font-weight:bold;letter-spacing:.3px}
  .logo .tag{font-size:11.5px;color:#9fc0ac;font-style:italic;margin-top:3px}
  .nav-btn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#c6dccd;padding:11px 24px;cursor:pointer;font-size:14.5px;border-left:3px solid transparent}
  .nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-btn.active{background:rgba(255,255,255,.10);color:#fff;border-left-color:var(--amber)}
  .nav-btn .ico{width:20px;text-align:center}
  .side-bottom{margin-top:auto;padding:14px 24px 0;border-top:1px solid rgba(255,255,255,.12)}
  main{flex:1;margin-left:225px;padding:30px 38px 60px}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
  .page-head h2{font-size:24px;color:var(--green-dark)}
  .page-head .sub{color:var(--muted);font-size:13.5px;margin-top:3px;font-style:italic}

  /* ---------- Components ---------- */
  .btn{background:var(--green);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600}
  .btn:hover{background:var(--green-dark)}
  .btn.amber{background:var(--amber)} .btn.amber:hover{background:#b96c1a}
  .btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
  .btn.ghost:hover{background:var(--green-soft)}
  .btn.danger{background:var(--red)} .btn.danger:hover{background:#8e2e24}
  .btn.small{padding:5px 11px;font-size:12.5px}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-family:'Segoe UI',sans-serif}
  .kpi .val{font-size:26px;font-weight:bold;color:var(--green-dark);margin-top:6px}
  .kpi .note{font-size:12px;color:var(--muted);margin-top:4px;font-family:'Segoe UI',sans-serif}
  table{width:100%;border-collapse:collapse;font-family:'Segoe UI',sans-serif;font-size:13.5px}
  th{text-align:left;padding:9px 12px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid var(--border)}
  td{padding:10px 12px;border-bottom:1px solid #efece3;vertical-align:middle}
  tr.clickable{cursor:pointer} tr.clickable:hover{background:#faf8f2}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;font-family:'Segoe UI',sans-serif}
  .pill.green{background:var(--green-soft);color:var(--green-dark)}
  .pill.amber{background:var(--amber-soft);color:#8a5313}
  .pill.red{background:var(--red-soft);color:var(--red)}
  .pill.blue{background:var(--blue-soft);color:var(--blue)}
  .pill.grey{background:#eceae2;color:#666}
  .search{padding:9px 13px;border:1px solid var(--border);border-radius:8px;width:250px;background:#fff}
  .empty{padding:44px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:10px}
  a.lnk{color:var(--green);cursor:pointer;text-decoration:underline}

  /* ---------- Pipeline ---------- */
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;align-items:start}
  .col{background:#efece3;border-radius:var(--radius);padding:12px;min-height:340px}
  .col.drag-over{outline:2px dashed var(--green);outline-offset:-3px;background:var(--green-soft)}
  .col-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .col-head .t{font-weight:bold;font-size:13.5px;color:var(--green-dark);font-family:'Segoe UI',sans-serif}
  .col-head .n{font-size:12px;color:var(--muted);font-family:'Segoe UI',sans-serif}
  .col-sum{font-size:11.5px;color:var(--muted);margin-bottom:10px;font-family:'Segoe UI',sans-serif}
  .deal{background:#fff;border:1px solid var(--border);border-radius:9px;padding:11px 12px;margin-bottom:9px;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.05);font-family:'Segoe UI',sans-serif}
  .deal:active{cursor:grabbing}
  .deal .dn{font-weight:600;font-size:13.5px;margin-bottom:3px}
  .deal .dc{font-size:12px;color:var(--muted)}
  .deal .dv{font-size:13px;color:var(--green-dark);font-weight:700;margin-top:6px}
  .deal .tags{margin-top:6px}

  /* ---------- Modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(20,35,26,.45);display:flex;align-items:flex-start;justify-content:center;z-index:60;padding:6vh 16px;overflow-y:auto}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;padding:26px 28px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
  .modal.wide{max-width:720px}
  .modal h3{color:var(--green-dark);font-size:19px;margin-bottom:16px}
  .frow{margin-bottom:13px}
  .frow label{display:block;font-size:12.5px;font-weight:600;color:#4a5a50;margin-bottom:5px;font-family:'Segoe UI',sans-serif}
  .frow input,.frow select,.frow textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
  .frow textarea{resize:vertical;min-height:70px}
  .frow .hint{font-size:11.5px;color:var(--muted);margin-top:4px;font-family:'Segoe UI',sans-serif}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

  /* ---------- Detail drawer / profile ---------- */
  .profile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .avatar{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;font-family:'Segoe UI',sans-serif;flex-shrink:0}
  .avatar.sq{border-radius:12px;background:var(--amber)}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:7px 14px;font-family:'Segoe UI',sans-serif;font-size:13.5px}
  .kv .k{color:var(--muted)}
  .section-title{font-size:15px;color:var(--green-dark);margin:0 0 12px;font-weight:bold}
  .note-item{border-left:3px solid var(--green-soft);padding:6px 12px;margin-bottom:10px;font-family:'Segoe UI',sans-serif;font-size:13px}
  .note-item .when{color:var(--muted);font-size:11px}

  /* ---------- Charts ---------- */
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:1100px){.chart-grid{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}}
  .chart-title{font-size:13px;font-weight:600;color:#4a5a50;margin-bottom:12px;font-family:'Segoe UI',sans-serif;text-transform:uppercase;letter-spacing:.6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-family:'Segoe UI',sans-serif;font-size:12px;color:var(--muted)}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}

  /* ---------- Invoice printing ---------- */
  @media print{
    body.print-inv > *{ display:none !important; }
    body.print-inv #modalRoot{ display:block !important; }
    body.print-inv #modalRoot .modal-bg{ position:static; padding:0; background:#fff; display:block; overflow:visible; }
    body.print-inv #modalRoot .modal{ box-shadow:none; max-width:100%; padding:0; }
    body.print-inv #modalRoot .modal > *:not(#invoicePrintArea){ display:none !important; }
    body.print-inv #invoicePrintArea{ border:none !important; }
  }

  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fff;padding:11px 22px;border-radius:9px;font-family:'Segoe UI',sans-serif;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
  #toast.show{opacity:1}
  #toast.err{background:var(--red)}
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ai-lead-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:11px 13px;margin-bottom:9px;font-family:'Segoe UI',sans-serif}
  .ai-lead-row input[type=checkbox]{margin-top:4px;width:auto}
  .banner{background:var(--amber-soft);border:1px solid #edd7b4;color:#7a4d13;border-radius:9px;padding:10px 15px;font-size:12.5px;font-family:'Segoe UI',sans-serif;margin-bottom:15px}
</style>
</head>
<body>

<div id="lockScreen" class="hidden"></div>

<div id="app" class="hidden">
  <aside>
    <div class="logo">
      <img id="sideLogo" alt="Lakhani's" class="side-logo">
      <div class="name hidden" id="sideCompanyName">Lakhani Foods Ltd</div>
      <div class="tag">Customer Relationship Manager</div>
      <div class="tag" id="sideBuild" style="font-size:10px;opacity:.65;font-style:normal"></div>
    </div>
    <button class="nav-btn" data-view="dashboard" onclick="App.go('dashboard')"><span class="ico">&#128200;</span> Analytics</button>
    <button class="nav-btn" data-view="pipeline"  onclick="App.go('pipeline')"><span class="ico">&#128736;</span> Lead Pipeline</button>
    <button class="nav-btn" data-view="contacts"  onclick="App.go('contacts')"><span class="ico">&#128100;</span> Contacts</button>
    <button class="nav-btn" data-view="companies" onclick="App.go('companies')"><span class="ico">&#127970;</span> Companies</button>
    <button class="nav-btn" data-view="stock"     onclick="App.go('stock')"><span class="ico">&#128230;</span> Stock</button>
    <button class="nav-btn" data-view="reports"   onclick="App.go('reports')"><span class="ico">&#128202;</span> Reports</button>
    <button class="nav-btn" data-view="pricing"   onclick="App.go('pricing')"><span class="ico">&#128200;</span> Pricing</button>
    <button class="nav-btn" data-view="quotes"    onclick="App.go('quotes')"><span class="ico">&#128196;</span> Quotes</button>
    <button class="nav-btn" data-view="orders"    onclick="App.go('orders')"><span class="ico">&#128203;</span> Orders</button>
    <button class="nav-btn" data-view="invoices"  onclick="App.go('invoices')"><span class="ico">&#129534;</span> Invoices</button>
    <button class="nav-btn" data-view="banking"   onclick="App.go('banking')"><span class="ico">&#127974;</span> Banking</button>
    <button class="nav-btn" data-view="settings"  onclick="App.go('settings')"><span class="ico">&#9881;&#65039;</span> Settings</button>
    <div class="side-bottom">
      <button class="nav-btn" id="syncbtn" onclick="doSync()" style="padding-left:0"><span class="ico">&#10227;</span> Sync now</button>
      <div id="syncstatus" style="font-size:11px;color:#9fc0ac;padding:2px 0 8px 31px;font-family:'Segoe UI',sans-serif"></div>
      <button class="nav-btn" onclick="App.lock()" style="padding-left:0"><span class="ico">&#128274;</span> Lock</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Lakhani Foods Ltd — CRM
   Single-file app. All data stored locally in this browser (localStorage).
   ===================================================================== */

/* ---------------- storage ---------------- */
function freshData(){
  return {
    contacts:[], companies:[], deals:[], orders:[], invoices:[],
    quotes:[], activities:[], docs:[],
    stock:{items:[], incoming:[]},
    bank:{connected:false, bankName:'', balance:0, transactions:[], updatedAt:0},
    counters:{invoice:0, quote:0},
    push:[], deleted:[], settingsUpdatedAt:0,
    settings:{companyName:'Lakhani Foods Ltd', currency:'£', apiKey:'',
      invoice:{businessName:'', address:'', email:'', phone:'', vatNo:'', vatRegistered:false, vatFrom:'', termsDays:30, bankDetails:'', footer:'Thank you for your business.'}}
  };
}
let store = loadStore();
function loadStore(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if(!raw) return freshData();
    const d = JSON.parse(raw);
    const f = freshData();
    const st = {...f, ...d, bank:{...f.bank, ...(d.bank||{})}, stock:{...f.stock, ...(d.stock||{})},
      counters:{...f.counters, ...(d.counters||{})},
      settings:{...f.settings, ...(d.settings||{}), invoice:{...f.settings.invoice, ...((d.settings||{}).invoice||{})}}};
    /* Legacy free-text deal notes become activities so nothing written before is lost */
    (st.deals||[]).forEach(dl=>{
      if(!dl.notes || !dl.notes.length || dl.notesMigrated) return;
      dl.notes.forEach(n=>st.activities.push({
        id: 'mig'+Math.random().toString(36).slice(2,10), createdAt:n.at, at:(n.at||'').slice(0,10),
        type:'note', text:n.text, dealId:dl.id, companyId:dl.companyId||null, contactId:dl.contactId||null}));
      dl.notesMigrated = true;
    });
    return st;
  }catch(e){ return freshData(); }
}
/* Change-stamping: every save diffs each record against the last snapshot and
   stamps updatedAt on anything that changed — that's what drives newest-wins sync. */
let _prevSnap = null;
function _snapOf(x){ const c = {...x}; delete c.updatedAt; return JSON.stringify(c); }
function _collections(){
  return {ct:store.contacts, co:store.companies, dl:store.deals, or:store.orders,
    iv:store.invoices, qu:store.quotes||[], ac:store.activities||[], dc:store.docs||[],
    si:store.stock.items, sn:store.stock.incoming, pu:store.push||[]};
}
function primeSnapshots(){
  _prevSnap = {};
  for(const [n, arr] of Object.entries(_collections()))
    (arr||[]).forEach(x=>{ if(x.id) _prevSnap[n+':'+x.id] = _snapOf(x); });
  _prevSnap['bank'] = JSON.stringify({c:store.bank.connected, n:store.bank.bankName, b:store.bank.balance});
  _prevSnap['set']  = JSON.stringify({n:store.settings.companyName, c:store.settings.currency, i:store.settings.invoice});
}
function stampChanges(){
  if(_prevSnap === null){ primeSnapshots(); return; }
  const now = Date.now();
  for(const [n, arr] of Object.entries(_collections())){
    (arr||[]).forEach(x=>{
      if(!x.id) return;
      const k = n+':'+x.id, s = _snapOf(x);
      if(_prevSnap[k] !== s){ x.updatedAt = now; _prevSnap[k] = s; }
    });
  }
  const bs = JSON.stringify({c:store.bank.connected, n:store.bank.bankName, b:store.bank.balance});
  if(_prevSnap['bank'] !== bs){ store.bank.updatedAt = now; _prevSnap['bank'] = bs; }
  const ss = JSON.stringify({n:store.settings.companyName, c:store.settings.currency, i:store.settings.invoice});
  if(_prevSnap['set'] !== ss){ store.settingsUpdatedAt = now; _prevSnap['set'] = ss; }
}
function markDeleted(id){
  if(!id) return;
  store.deleted = store.deleted || [];
  store.deleted.push({id, at:Date.now()});
  if(store.deleted.length > 800) store.deleted = store.deleted.slice(-800);
}
function save(fromSync){
  if(!fromSync) stampChanges();
  localStorage.setItem(DATA_KEY, JSON.stringify(store));
  if(!fromSync) scheduleAutoSync();
}

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){
  const c = store.settings.currency || '£';
  n = Number(n)||0;
  return c + n.toLocaleString(undefined,{maximumFractionDigits:0});
}
function fmtSigned(n){ return (n<0?'-':'+') + fmt(Math.abs(n)); }
function fdate(iso){ if(!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
function monthKey(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ const [y,m]=key.split('-'); return new Date(y, m-1, 1).toLocaleDateString(undefined,{month:'short'}); }
function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (isErr?' err':'');
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.className=''; }, 3200);
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

const EXPIRY_WARN_DAYS = 45;
function docExpiry(d){
  if(!d.validUntil) return null;

function fmtBytes(n){
  if(n==null) return '';
  if(n < 1024) return n+' B';
  if(n < 1024*1024) return (n/1024).toFixed(0)+' KB';

}
/* Binary-safe base64, for file bytes rather than text */
function bufToB64(buf){
  const bytes = new Uint8Array(buf); let bin = ''; const CH = 0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(bin);
}
function b64ToBlob(b64, mime){
  const bin = atob(String(b64).replace(/\n/g,''));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], {type: mime || 'application/octet-stream'});
}

/* ---- VAT ----
   Nothing here has any effect until "We are VAT registered" is ticked in Settings.
   Before that, documents show a single total and no VAT number, as they must. */
function vatRegistered(){ return !!(store.settings.invoice||{}).vatRegistered; }
function vatRateOf(it){
  if(!it || it.vatRate==null || it.vatRate==='exempt') return 0;
  const n = Number(it.vatRate);
  return isNaN(n) ? 0 : n;
}
/* Groups a document's lines by VAT rate. Returns net, the per-rate VAT bands, and gross. */
function vatBreakdown(items, applyVat){
  if(applyVat===undefined) applyVat = vatRegistered();
  const bands = {};
  let net = 0;
  (items||[]).forEach(l=>{
    const it = stockItemById(l.itemId);
    const line = l.qty * (l.unitPrice||0);
    net += line;
    const r = applyVat ? vatRateOf(it) : 0;
    const key = String(r);
    bands[key] = (bands[key]||0) + line;
  });
  const rows = Object.keys(bands).sort((a,b)=>Number(b)-Number(a)).map(k=>({
    rate: Number(k), base: bands[k], vat: bands[k] * Number(k)/100
  }));
  const vat = rows.reduce((s,r)=>s+r.vat, 0);
  return {net, rows, vat, gross: net + vat};
}
/* The totals block shared by invoices and quotes */
function totalsRowsHtml(items, label, cols, applyVat){
  if(applyVat===undefined) applyVat = vatRegistered();
  const v = vatBreakdown(items, applyVat);
  const pad = cols - 1;
  if(!applyVat || v.vat === 0){
    return `<tr><td colspan="${pad}" style="text-align:right;font-weight:bold;border-top:2px solid var(--border)">${label}</td>
      <td style="text-align:right;font-weight:bold;font-size:16px;border-top:2px solid var(--border)">${fmtMoney(v.net)}</td></tr>`;
  }
  return `<tr><td colspan="${pad}" style="text-align:right;border-top:2px solid var(--border)">Subtotal (excl. VAT)</td>
      <td style="text-align:right;border-top:2px solid var(--border)">${fmtMoney(v.net)}</td></tr>`
    + v.rows.filter(r=>r.rate>0).map(r=>
      `<tr><td colspan="${pad}" style="text-align:right">VAT at ${r.rate}% on ${fmtMoney(r.base)}</td>
        <td style="text-align:right">${fmtMoney(r.vat)}</td></tr>`).join('')
    + (v.rows.some(r=>r.rate===0)
      ? `<tr><td colspan="${pad}" style="text-align:right;color:#777">Zero-rated / exempt goods</td>
          <td style="text-align:right;color:#777">${fmtMoney(v.rows.find(r=>r.rate===0).base)}</td></tr>` : '')
    + `<tr><td colspan="${pad}" style="text-align:right;font-weight:bold;border-top:1px solid var(--border)">${label}</td>
        <td style="text-align:right;font-weight:bold;font-size:16px;border-top:1px solid var(--border)">${fmtMoney(v.gross)}</td></tr>`;
}

async function sha256(text){
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  // fallback (non-crypto env): simple hash
  let h = 0; for(let i=0;i<text.length;i++){ h = Math.imul(31,h) + text.charCodeAt(i) | 0; }
  return 'fb'+h.toString(16);
}

/* =====================================================================
   SYNC — shared data in a private GitHub repo (contents API), lodge-style:
   newest-updatedAt-wins per record, tombstones stop deletions resurrecting.
   ===================================================================== */
function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s){ return decodeURIComponent(escape(atob(String(s).replace(/\n/g,'')))); }
function syncToken(){ return localStorage.getItem(SYNC_TOKEN_KEY) || ''; }

let syncCfg = null;   // optional sync-config.json (encrypted token, unlocked by passphrase)
async function loadSyncCfg(){
  try{ syncCfg = await (await fetch('./sync-config.json?v='+Date.now())).json(); }
  catch(e){ syncCfg = {configured:false}; }
}
async function decryptSyncToken(passphrase){
  if(!syncCfg || !syncCfg.configured) return null;
  try{
    const enc = new TextEncoder();
    const salt = Uint8Array.from(atob(syncCfg.salt), c=>c.charCodeAt(0));
    const iv   = Uint8Array.from(atob(syncCfg.iv),   c=>c.charCodeAt(0));
    const ct   = Uint8Array.from(atob(syncCfg.ct),   c=>c.charCodeAt(0));
    const base = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
    const key  = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
                   base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    return new TextDecoder().decode(pt);
  }catch(e){ return null; }
}

function ghHeaders(){ return {'Authorization':'token '+syncToken(), 'Accept':'application/vnd.github+json'}; }
async function ghGet(path){
  const r = await fetch(DATA_API+path+'?ref=main&t='+Date.now(), {headers:ghHeaders(), cache:'no-store'});
  if(r.status===404) return null;
  if(r.status===401 || r.status===403) throw new Error('sync token was rejected — check it in Settings');
  if(!r.ok) throw new Error('GitHub read failed ('+r.status+')');
  return r.json();
}
async function ghPut(path, contentB64, message, sha){
  const body = {message, content:contentB64, branch:'main'};
  if(sha) body.sha = sha;
  const r = await fetch(DATA_API+path, {method:'PUT', headers:ghHeaders(), body:JSON.stringify(body)});
  if(!r.ok) throw new Error('GitHub write failed ('+r.status+')');
  return r.json();
}

/* ---- merge: newest updatedAt wins per record; tombstones filter deletions ---- */
function mergeById(a, b, keyFn){
  keyFn = keyFn || (x=>x.id);
  const map = new Map();
  (a||[]).forEach(x=>map.set(keyFn(x), x));
  (b||[]).forEach(x=>{ const k=keyFn(x), cur=map.get(k);
    if(!cur || (x.updatedAt||0) > (cur.updatedAt||0)) map.set(k, x); });
  return [...map.values()];
}
function txKey(t){ return t.id || ((t.date||'')+'|'+(t.desc||'')+'|'+t.amount); }
function buildPayload(){
  return {
    contacts:store.contacts, companies:store.companies, deals:store.deals,
    orders:store.orders, invoices:store.invoices,
    quotes:store.quotes||[], activities:store.activities||[], docs:store.docs||[],
    stock:{items:store.stock.items, incoming:store.stock.incoming},
    bank:store.bank, counters:store.counters,
    settingsShared:{companyName:store.settings.companyName, currency:store.settings.currency, invoice:store.settings.invoice},
    settingsUpdatedAt:store.settingsUpdatedAt||0,
    push:store.push||[], deleted:store.deleted||[]
  };
}
function mergePayloads(r, l){
  if(!r) return l;
  const delMap = new Map();
  (r.deleted||[]).concat(l.deleted||[]).forEach(d=>delMap.set(d.id, d));
  const del = [...delMap.values()].sort((a,b)=>a.at-b.at).slice(-800);
  const delSet = new Set(del.map(d=>d.id));
  const alive = arr => (arr||[]).filter(x=>!delSet.has(x.id));
  const out = {};
  out.contacts  = alive(mergeById(r.contacts,  l.contacts));
  out.companies = alive(mergeById(r.companies, l.companies));
  out.deals     = alive(mergeById(r.deals,     l.deals));
  out.orders    = alive(mergeById(r.orders,    l.orders));
  out.invoices  = alive(mergeById(r.invoices,  l.invoices));
  out.quotes    = alive(mergeById(r.quotes,    l.quotes));
  out.activities= alive(mergeById(r.activities,l.activities));
  out.docs      = alive(mergeById(r.docs,      l.docs));
  out.stock = {
    items:    alive(mergeById((r.stock||{}).items,    (l.stock||{}).items)),
    incoming: alive(mergeById((r.stock||{}).incoming, (l.stock||{}).incoming))
  };
  const rb = r.bank||{}, lb = l.bank||{};
  const bankScal = (rb.updatedAt||0) >= (lb.updatedAt||0) ? rb : lb;
  out.bank = {...bankScal,
    transactions: mergeById(rb.transactions, lb.transactions, txKey)
      .filter(t=>!delSet.has(txKey(t)))
      .sort((a,b)=>(b.date||'').localeCompare(a.date||''))};
  out.counters = {invoice: Math.max((r.counters||{}).invoice||0, (l.counters||{}).invoice||0),
                  quote:   Math.max((r.counters||{}).quote||0,   (l.counters||{}).quote||0)};
  if((r.settingsUpdatedAt||0) >= (l.settingsUpdatedAt||0)){
    out.settingsShared = r.settingsShared || l.settingsShared; out.settingsUpdatedAt = r.settingsUpdatedAt||0;
  } else { out.settingsShared = l.settingsShared; out.settingsUpdatedAt = l.settingsUpdatedAt||0; }
  out.push = mergeById(r.push, l.push);
  out.deleted = del;
  return out;
}
function applyPayload(p){
  store.contacts = p.contacts||[]; store.companies = p.companies||[]; store.deals = p.deals||[];
  store.orders = p.orders||[]; store.invoices = p.invoices||[];
  store.quotes = p.quotes||[]; store.activities = p.activities||[]; store.docs = p.docs||[];
  store.stock = {items:(p.stock||{}).items||[], incoming:(p.stock||{}).incoming||[]};
  store.bank = {...freshData().bank, ...(p.bank||{})};
  store.counters = {...store.counters, ...(p.counters||{})};
  const ss = p.settingsShared||{};
  store.settings = {...store.settings,
    companyName:ss.companyName||store.settings.companyName,
    currency:ss.currency||store.settings.currency,
    invoice:{...store.settings.invoice, ...(ss.invoice||{})}};
  store.settingsUpdatedAt = p.settingsUpdatedAt||0;
  store.push = p.push||[]; store.deleted = p.deleted||[];
  primeSnapshots();   // merge results must not be re-stamped as local edits
}

/* which record ids should wake the push sender ([notify] commit flag) */
function notifyIds(p){
  const ids = new Set(); if(!p) return ids;
  (p.orders||[]).forEach(o=>ids.add('o'+o.id));
  (p.invoices||[]).forEach(i=>ids.add('i'+i.id));
  (p.deals||[]).forEach(d=>{ if(d.status==='won') ids.add('w'+d.id); });
  return ids;
}
function hasNewNotifiable(remote, merged){
  const before = notifyIds(remote);
  for(const id of notifyIds(merged)) if(!before.has(id)) return true;
  return false;
}

let syncing = false, _syncQueued = null;
function scheduleAutoSync(){
  if(!syncToken() || syncing) return;
  clearTimeout(_syncQueued);
  _syncQueued = setTimeout(()=>doSync(true), 8000);   // push changes shortly after you stop editing
}
async function doSync(silent){
  if(syncing) return;
  if(!syncToken()){
    if(silent !== true) toast('Sync isn\'t connected on this device yet — see Settings → Sync.', true);
    return;
  }
  syncing = true; updateSyncUi(true);
  try{
    const file = await ghGet('data.json');
    let remote = null;
    if(file){ try{ remote = JSON.parse(b64decode(file.content)); }catch(e){} }
    const merged = mergePayloads(remote, buildPayload());
    const mergedText = JSON.stringify(merged);
    if(mergedText !== (remote ? JSON.stringify(remote) : null)){
      const flag = hasNewNotifiable(remote, merged) ? ' [notify]' : '';
      await ghPut('data.json', b64encode(mergedText), 'CRM sync'+flag, file ? file.sha : undefined);
    }
    applyPayload(merged); save(true);
    localStorage.setItem(LAST_SYNC_KEY, String(Date.now()));
    if(silent !== true) toast('Synced — this device now has the latest data.');
  }catch(e){
    if(silent !== true) toast('Sync failed: '+e.message+'. Check your connection and try again.', true);
  }finally{
    syncing = false; updateSyncUi(false);
    // refresh the screen unless the user is mid-modal
    const appEl = document.querySelector('#app');
    if(appEl && !appEl.classList.contains('hidden') && !document.querySelector('#modalRoot').innerHTML){
      App.go(App.view, App.param);
    }
  }
}
function updateSyncUi(busy){
  const b = document.querySelector('#syncbtn');
  if(b){ b.disabled = busy; b.innerHTML = busy ? '<span class="ico">&#8987;</span> Syncing…' : '<span class="ico">&#10227;</span> Sync now'; }
  const s = document.querySelector('#syncstatus');
  if(s) s.textContent = lastSyncText();
}
function lastSyncText(){
  if(!syncToken()) return 'Sync not connected';
  const t = Number(localStorage.getItem(LAST_SYNC_KEY)||0);
  if(!t) return 'Not synced yet';
  const d = new Date(t), today = new Date();
  return 'Synced '+(d.toDateString()===today.toDateString()
    ? d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})
    : d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}));
}
function autoSync(){
  if(Date.now() - Number(localStorage.getItem(LAST_SYNC_KEY)||0) < 60000) return;  // min 60s apart
  doSync(true);
}

        <label class="remember-row"><input type="checkbox" id="rememberMe" checked style="width:auto"> Remember me on this device for 30 days</label>
        <button class="btn" style="width:100%" onclick="App.tryLogin()">Unlock</button>
      </div>`;
    setTimeout(()=>{ const i=$('#loginPw'); if(i) i.focus(); }, 50);
  }
}
function showApp(){
  $('#lockScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  App.go(App.view || 'dashboard');
}

/* =====================================================================
   APP (global controller)
   ===================================================================== */
const App = {
  view:'dashboard',

  /* ---- auth actions ---- */
  async setupPassword(){
    const p1 = $('#setupPw').value, p2 = $('#setupPw2').value;
    if(p1.length < 4){ $('#setupErr').textContent = 'Password must be at least 4 characters.'; return; }
    if(p1 !== p2){ $('#setupErr').textContent = 'Passwords do not match.'; return; }
    setAuth({enabled:true, hash: await sha256(p1)});
    sessionStorage.setItem(SESSION_KEY,'1');
    localStorage.setItem(REMEMBER_KEY, JSON.stringify({until: Date.now()+30*864e5}));
    showApp(); toast('Password set. Welcome!');
  },
  skipPassword(){
    setAuth({enabled:false, hash:null});
    showApp(); toast('Welcome to your CRM!');
  },
  async tryLogin(){
    const a = getAuth();
    const pw = $('#loginPw').value;
    if(await sha256(pw) === a.hash){
      sessionStorage.setItem(SESSION_KEY,'1');
      if($('#rememberMe').checked){
        localStorage.setItem(REMEMBER_KEY, JSON.stringify({until: Date.now()+30*864e5}));
      }
      showApp();
    } else {
      $('#loginErr').textContent = 'Incorrect password.';
      $('#loginPw').value=''; $('#loginPw').focus();
    }
  },
  lock(){
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(REMEMBER_KEY);

    if(!a || !a.enabled){ toast('No password set — enable one in Settings to use locking.', true); return; }

  saveDeal(id){
    const name = $('#df_name').value.trim();
    if(!name){ toast('Deal name is required.', true); return; }
    const stage = $('#df_stage').value;
    const lines = [];
    document.querySelectorAll('#dl_rows .dl-row').forEach(r=>{
      const itemId = r.querySelector('.dl-item').value;
      const qty = Number(r.querySelector('.dl-qty').value)||0;
      if(itemId && qty>0) lines.push({itemId, qty});
    });
    const data = {
      name, companyId:$('#df_company').value||null, contactId:$('#df_contact').value||null,
      value:Number($('#df_value').value)||0, stage, nextStep:$('#df_next').value.trim(),
      nextDue:$('#df_nextDue').value||null, closeDate:$('#df_close').value||null,
      stockLines: lines
    };
    if(id){
      const d = dealById(id);
      const wasWon = d.status==='won';
      Object.assign(d, data);
      d.status = (stage==='Closed Won') ? 'won' : (d.status==='lost' ? 'lost' : 'open');
      if(d.status==='won' && !wasWon) d.closedAt = new Date().toISOString();
      toast('Lead updated.');
    } else {
      store.deals.push({id:uid(), createdAt:new Date().toISOString(), status: stage==='Closed Won'?'won':'open',
        closedAt: stage==='Closed Won'?new Date().toISOString():null, source:'manual', notes:[], ...data});
      toast('Lead added to pipeline.');
    }
    save(); this.closeModal(); this.go(this.view, this.param);
  },
  deleteDeal(id){
    if(!confirm('Delete this lead permanently?')) return;
    markDeleted(id);
    store.deals = store.deals.filter(d=>d.id!==id);
    save(); this.closeModal(); this.go('pipeline'); toast('Lead deleted.');
  },
  moveDeal(id, stage){
    const d = dealById(id); if(!d) return;
    d.stage = stage;
    if(stage === 'Closed Won'){
      if(d.status!=='won'){ d.status='won'; d.closedAt = new Date().toISOString(); toast('Deal won! 🎉 ' + fmt(d.value)); }
    } else {
      if(d.status==='won'){ d.status='open'; d.closedAt=null; }
    }
    save(); this.go('pipeline');
  },
  markLost(id){
    const d = dealById(id); if(!d) return;
    if(!confirm('Mark "'+d.name+'" as lost?')) return;
    d.status='lost'; d.closedAt=new Date().toISOString();
    save(); this.closeModal(); this.go(this.view==='deal'?'pipeline':this.view, this.param); toast('Marked as lost.');

  reopenDeal(id){
    const d = dealById(id); if(!d) return;
    d.status='open'; d.closedAt=null; if(d.stage==='Closed Won') d.stage='Negotiation';
    save(); this.go('deal', id); toast('Lead reopened.');

  addDealNote(id, text){
    const d = dealById(id); if(!d) return;
    const txt = (text!=null ? text : ($('#dn_text') ? $('#dn_text').value.trim() : ''));
    if(!txt) return;
    store.activities.push({id:uid(), createdAt:new Date().toISOString(), at:todayISO(),
      type:'note', text:txt, dealId:id, companyId:d.companyId||null, contactId:d.contactId||null});
    save(); this.go('deal', id);
  },

  addDealLine(){ $('#dl_rows').insertAdjacentHTML('beforeend', dealLineRowHtml(null)); },

  prefillFromCompany(){

    if(!co || !co.stockEstimates || !co.stockEstimates.length) return;

  fulfillDeal(id){
    const d = dealById(id); if(!d || d.status!=='won' || d.fulfilled) return;
    if(!confirm('Mark stock as delivered for this deal? On-hand quantities will be deducted.')) return;
    effectiveLines(d).lines.forEach(l=>{
      const it = stockItemById(l.itemId);
      if(it) it.onHand -= l.qty;
    });
    d.fulfilled = true; d.fulfilledAt = new Date().toISOString();
    store.activities.push({id:uid(), createdAt:new Date().toISOString(), at:todayISO(), type:'note',
      text:'Stock delivered — quantities deducted from stock on hand.',
      dealId:d.id, companyId:d.companyId||null, contactId:d.contactId||null});
    save(); this.go('deal', id); toast('Stock deducted for this deal.');
  },

  openDocs(itemId){ this.docsModal('product', itemId); },

  docsModal(scope, itemId){

        <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:14px">
          <div class="section-title">Add a document</div>
          <div class="f2">
            <div class="frow"><label>Type</label><select id="dc_type">${
              types.map(t=>`<option value="${t.k}">${t.label}</option>`).join('')}</select></div>
            <div class="frow"><label>Name</label><input id="dc_name" placeholder="${
              isCo ? 'e.g. Public liability 2026-27' : 'e.g. Bhajia Kit spec v3'}"></div>
          </div>
          <div class="frow" style="max-width:50%"><label>Valid until (optional)</label>
            <input id="dc_valid" type="date">
            <div class="hint">${isCo
              ? 'Insurance and audit certificates expire. Set the date and the CRM warns you 45 days out.'
              : 'Useful if the spec is tied to a recipe or supplier that will change.'}</div>
          </div>
          <div class="frow"><label>Upload a file</label>
            <input type="file" id="dc_file" ${hasSync?'':'disabled'}>
            <div class="hint">Stored in your private data repo and available on both laptops. Keep files under about 10MB.</div>
          </div>
          <div class="frow"><label>…or link to one hosted elsewhere</label>
            <input id="dc_url" placeholder="https://…">
            <div class="hint">Use a link when the file is large, or when you want buyers to open it themselves.</div>
          </div>
          <div class="frow"><label>Note (optional)</label><input id="dc_note" placeholder="${
            isCo ? 'e.g. Broker: Smith & Co, policy 12345' : 'e.g. Issued Aug 2026, supersedes v2'}"></div>
          <div id="dc_status" style="font-family:'Segoe UI',sans-serif;font-size:12.5px;color:var(--muted);margin-bottom:8px"></div>
          <button class="btn" id="dc_addBtn" onclick="App.addDoc('${scope}','${itemId||''}')">Add document</button>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="App.closeModal()">Close</button>
          ${isCo ? '' : `<button class="btn ghost" onclick="App.printSpecSheet('${itemId}')">&#128424; Print spec sheet</button>`}
        </div>
      </div>`);
  },
  async addDoc(scope, itemId){
    const name = $('#dc_name').value.trim();
    const url  = $('#dc_url').value.trim();
    const file = $('#dc_file').files[0];
    if(!name){ toast('Give the document a name.', true); return; }
    if(!file && !url){ toast('Choose a file to upload, or paste a link.', true); return; }
    const status = $('#dc_status'), btn = $('#dc_addBtn');
    const base = {id:uid(), scope, itemId: scope==='product' ? itemId : null,
      type:$('#dc_type').value, name, validUntil:$('#dc_valid').value||null,
      note:$('#dc_note').value.trim(), addedAt:new Date().toISOString()};
    if(!file){
      store.docs.push({...base, url});
      save(); toast('Link added.'); this.docsModal(scope, itemId); return;
    }
    if(file.size > 12*1024*1024){ toast('That file is over 12MB — add it as a link instead.', true); return; }
    btn.disabled = true; status.textContent = 'Uploading ' + file.name + '…';
    try{
      const b64 = bufToB64(await file.arrayBuffer());
      const path = 'docs/' + base.id + '-' + safeFileName(file.name);
      await ghPut(path, b64, 'Add document: ' + name);
      store.docs.push({...base, path, fileName:file.name, size:file.size, mime:file.type||''});
      save();
      status.textContent = '';
      toast('Uploaded.');
      this.docsModal(scope, itemId);
    }catch(e){
      btn.disabled = false;
      status.innerHTML = '<span style="color:var(--red)">Upload failed: ' + esc(e.message) + '</span>';
    }
  },
  async downloadDoc(id){
    const d = docById(id); if(!d) return;
    if(d.url){ window.open(d.url, '_blank'); return; }
    toast('Fetching ' + (d.fileName||d.name) + '…');
    try{
      const r = await ghGet(d.path);
      if(!r || !r.content) throw new Error('file not found in the data repo');
      const blob = b64ToBlob(r.content, d.mime);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = d.fileName || (safeFileName(d.name) + '.pdf');
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    }catch(e){ toast('Could not download: ' + e.message, true); }
  },
  /* Grabs a whole set at once — the buyer pack, or every file on one product */
  async downloadDocSet(scope, itemId){
    const docs = (scope==='company' ? companyDocs() : docsForItem(itemId)).filter(d=>!d.url);
    if(!docs.length){ toast('No uploaded files to download.', true); return; }
    const stale = docs.filter(d=>{ const e = docExpiry(d); return e && e.state==='expired'; });
    if(stale.length && !confirm(stale.length + ' of these documents ' + (stale.length===1?'has':'have')
      + ' expired:\n\n  ' + stale.map(d=>d.name).join('\n  ')
      + '\n\nDownload anyway?')) return;
    toast('Fetching ' + docs.length + ' file' + (docs.length===1?'':'s') + '…');
    for(const d of docs){ await this.downloadDoc(d.id); await new Promise(r=>setTimeout(r, 600)); }
  },
  deleteDoc(id, scope, itemId){
    const d = docById(id); if(!d) return;
    if(!confirm('Remove "' + d.name + '"?'
      + (d.path ? '\n\nThe file stays in your data repo — this only removes it from the CRM.' : ''))) return;
    markDeleted(id);
    store.docs = store.docs.filter(x=>x.id!==id);
    save(); this.docsModal(scope || docScope(d), itemId || d.itemId);
  },
  /* A branded, printable specification built from the product record itself */
  printSpecSheet(itemId){
    const it = stockItemById(itemId); if(!it) return;

  /* =============== QUOTES =============== */
  addQuoteLine(){
    $('#ql_rows').insertAdjacentHTML('beforeend', quoteLineRowHtml(null));
    this.onQuoteLineItemChange($('#ql_rows').lastElementChild.querySelector('.ql-item'));
  },
  onQuoteLineItemChange(sel){
    const row = sel.closest('.ql-row');
    const it = stockItemById(sel.value);
    const priceEl = row.querySelector('.ql-price'), qtyEl = row.querySelector('.ql-qty');
    if(it && it.tradePrice!=null && !priceEl.value) priceEl.value = it.tradePrice;
    if(it && it.moq && !qtyEl.value) qtyEl.value = ceilToMultiple(it.moq, it.orderMultiple);
    this.checkQuoteLine(sel);
  },
  checkQuoteLine(el){
    const row = el.closest('.ql-row');
    const it = stockItemById(row.querySelector('.ql-item').value);
    const qty = Number(row.querySelector('.ql-qty').value)||0;
    const price = Number(row.querySelector('.ql-price').value)||0;
    const note = row.querySelector('.ql-note');
    const parts = [];
    if(it){
      const pk = packLabel(it); if(pk) parts.push(esc(pk));
      const issue = qtyIssue(it, qty);
      if(issue) parts.push(`<span style="color:var(--red);font-weight:600">${qty} is ${esc(issue.msg)}</span>
        <button type="button" class="btn small ghost" style="padding:1px 7px;margin-left:4px"
          onclick="App.roundUpQuoteLine(this, ${issue.suggest})">Round up to ${issue.suggest}</button>`);
      const m = lineMargin(it, price, qty);
      if(m && qty){
        const col = m.gp < 0 ? 'var(--red)' : 'var(--green-dark)';
        parts.push(`margin <span style="color:${col};font-weight:600">${fmtMoney(m.gp)} (${m.pct.toFixed(1)}%)</span>`);
      }
    }
    note.innerHTML = parts.join(' &nbsp;·&nbsp; ');
    this.refreshQuoteTotals();
  },
  roundUpQuoteLine(btn, qty){
    const row = btn.closest('.ql-row');
    row.querySelector('.ql-qty').value = qty;
    this.checkQuoteLine(row.querySelector('.ql-qty'));
  },
  refreshQuoteTotals(){
    const el = $('#ql_totals'); if(!el) return;
    const items = readQuoteLines();
    if(!items.length){ el.innerHTML = ''; return; }
    const m = orderMargin({items});
    const col = m.gp < 0 ? 'var(--red)' : 'var(--green-dark)';
    el.innerHTML = `<b>Quote total ${fmtMoney(m.rev)}</b>`
      + (m.cost ? ` &nbsp;·&nbsp; cost ${fmtMoney(m.cost)} &nbsp;·&nbsp; gross margin
        <span style="color:${col};font-weight:700">${fmtMoney(m.gp)} (${m.pct.toFixed(1)}%)</span>` : '');
  },
  openQuoteForm(id, preset){
    preset = preset || {};
    if(!store.stock.items.length){ toast('Add your products in the Stock tab first — quotes are built from SKUs.', true); return; }
    if(!store.companies.length){ toast('Add a company first — every quote belongs to a company.', true); return; }
    const q = id ? quoteById(id) : null;
    const cur = q || preset;
    const compOpts = store.companies.map(c=>`<option value="${c.id}" ${cur.companyId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
    const conOpts = ['<option value="">— none —</option>'].concat(
      store.contacts.map(c=>`<option value="${c.id}" ${cur.contactId===c.id?'selected':''}>${esc(contactName(c))}</option>`)).join('');
    const dealOpts = ['<option value="">— none —</option>'].concat(
      store.deals.map(d=>`<option value="${d.id}" ${cur.dealId===d.id?'selected':''}>${esc(d.name)}</option>`)).join('');
    this.modal(`
      <div class="modal">
        <h3>${q?'Edit quote '+esc(q.number):'New quote'}</h3>
        <div class="f2">
          <div class="frow"><label>Company *</label><select id="qf_company">${compOpts}</select></div>
          <div class="frow"><label>Contact</label><select id="qf_contact">${conOpts}</select></div>
        </div>
        <div class="f2">
          <div class="frow"><label>Linked deal</label><select id="qf_deal">${dealOpts}</select>
            <div class="hint">Links the quote to a lead so it shows on that deal's timeline.</div></div>
          <div class="frow"><label>Valid until</label><input id="qf_valid" type="date" value="${q&&q.validUntil?q.validUntil:addDaysISO(todayISO(),30)}"></div>
        </div>
        <div class="frow"><label>Quote lines (SKU × quantity × unit price)</label>
          <div id="ql_rows">${(q&&q.items?q.items:[]).map(l=>quoteLineRowHtml(l)).join('')}</div>
          <button type="button" class="btn small ghost" onclick="App.addQuoteLine()">+ Add SKU</button>
          <div id="ql_totals" style="margin-top:9px;font-family:'Segoe UI',sans-serif;font-size:13px"></div>
          <div class="hint">Pack size, MOQ and lead time are printed on the quote automatically.</div>
        </div>
        <div class="frow"><label>Notes on the quote</label><textarea id="qf_notes" placeholder="e.g. Delivered to your Enfield depot. Prices exclude VAT.">${esc(q?q.notes:'')}</textarea></div>
        <div class="modal-actions">
          ${q?'<button class="btn danger small" style="margin-right:auto" onclick="App.deleteQuote(\''+q.id+'\')">Delete</button>':''}
          <button class="btn ghost" onclick="App.closeModal()">Cancel</button>
          <button class="btn" onclick="App.saveQuote('${q?q.id:''}')">${q?'Save quote':'Create quote'}</button>
        </div>
      </div>`);
    document.querySelectorAll('#ql_rows .ql-row .ql-qty').forEach(el=>this.checkQuoteLine(el));
    this.refreshQuoteTotals();
  },
  saveQuote(id){
    const companyId = $('#qf_company').value;
    if(!companyId){ toast('Choose a company.', true); return; }
    const items = readQuoteLines();
    if(!items.length){ toast('Add at least one quote line with a quantity.', true); return; }
    const breaches = items.map(l=>{
      const it = stockItemById(l.itemId); const iss = qtyIssue(it, l.qty);
      return iss ? `${it.name}: ${l.qty} is ${iss.msg}` : null;
    }).filter(Boolean);
    if(breaches.length && !confirm('These lines break your ordering rules:\n\n  ' + breaches.join('\n  ')
      + '\n\nQuote it anyway?')) return;
    const data = {companyId, contactId:$('#qf_contact').value||null, dealId:$('#qf_deal').value||null,
      validUntil:$('#qf_valid').value||null, notes:$('#qf_notes').value.trim(), items};
    if(id){ Object.assign(quoteById(id), data); save(); this.closeModal(); this.go(this.view, this.param); toast('Quote updated.'); return; }
    store.counters.quote = (store.counters.quote||0) + 1;
    const q = {id:uid(), number:'QUO-'+String(store.counters.quote).padStart(4,'0'),
      date:todayISO(), status:'draft', orderId:null, vatApplied: vatRegistered(),
      createdAt:new Date().toISOString(), ...data};
    store.quotes.push(q);
    save(); this.closeModal(); this.openQuoteView(q.id); toast('Quote '+q.number+' created.');
  },
  deleteQuote(id){
    if(!confirm('Delete this quote?')) return;
    markDeleted(id);
    store.quotes = store.quotes.filter(q=>q.id!==id);
    save(); this.closeModal(); this.go('quotes'); toast('Quote deleted.');
  },
  markQuoteSent(id){
    const q = quoteById(id); if(!q) return;
    q.status = 'sent'; q.sentAt = new Date().toISOString();
    if(q.dealId) store.activities.push({id:uid(), createdAt:new Date().toISOString(), at:todayISO(),
      type:'quote', text:'Sent quote '+q.number+' — '+fmtMoney(quoteTotal(q)),
      dealId:q.dealId, companyId:q.companyId, contactId:q.contactId});
    save(); this.go(this.view, this.param); toast('Marked as sent.');
  },
  setQuoteStatus(id, status){
    const q = quoteById(id); if(!q) return;
    q.status = status;
    save(); this.go(this.view, this.param); toast('Quote marked '+status+'.');
  },
  /* Turn an accepted quote into a confirmed order, keeping the quoted prices */
  convertQuoteToOrder(id){
    const q = quoteById(id); if(!q) return;
    if(q.orderId){ toast('This quote has already become an order.', true); this.go('orders'); return; }
    if(!confirm(`Turn ${q.number} into a confirmed order?\n\nThe quoted prices are carried across unchanged.`)) return;
    const o = {id:uid(), createdAt:new Date().toISOString(), status:'confirmed',
      companyId:q.companyId, contactId:q.contactId, ref:q.number,
      orderDate:todayISO(), deliveryDate:null, items:q.items.map(l=>({...l})), quoteId:q.id};
    store.orders.push(o);
    q.orderId = o.id; q.status = 'accepted';
    if(q.dealId) store.activities.push({id:uid(), createdAt:new Date().toISOString(), at:todayISO(),
      type:'note', text:'Quote '+q.number+' accepted and converted to an order.',
      dealId:q.dealId, companyId:q.companyId, contactId:q.contactId});
    save();
    this.openInvoicePrompt(o.id);
  },

              <div class="sans" style="font-size:12.5px;color:#555;white-space:pre-wrap">${esc(biz.address||'')}</div>
              ${(biz.vatNo && vatRegistered())?`<div class="sans" style="font-size:12.5px;color:#555">VAT: ${esc(biz.vatNo)}</div>`:''}

              <div style="font-size:24px;color:var(--green-dark);letter-spacing:1px">QUOTATION</div>
              <div class="sans" style="font-size:13px"><b>${esc(q.number)}</b></div>
              <div class="sans" style="font-size:12.5px;color:#555">Date: ${fdate(q.date)}</div>
              ${q.validUntil?`<div class="sans" style="font-size:12.5px;color:${expired?'#b03a2e':'#555'}">Valid until: ${fdate(q.validUntil)}</div>`:''}
            </div>
          </div>
          <div style="margin:18px 0 14px">
            <div class="sans" style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.7px">Quotation for</div>
            <div style="font-weight:bold">${esc(co?co.name:'')}</div>
            ${co&&co.location?`<div class="sans" style="font-size:12.5px;color:#555">${esc(co.location)}</div>`:''}
            ${con?`<div class="sans" style="font-size:12.5px;color:#555">FAO ${esc(contactName(con))}</div>`:''}
          </div>
          <table>
            <thead><tr><th>Item</th><th>Pack</th><th>Qty</th><th>Unit price</th><th style="text-align:right">Amount</th></tr></thead>
            <tbody>
            ${q.items.map(l=>{
              const it = stockItemById(l.itemId);
              const rules = it ? orderRuleLabel(it) : '';
              return `<tr>
                <td><b>${it?esc(it.name):'Item'}</b>${rules?`<div class="sans" style="font-size:11.5px;color:#666">${esc(rules)}</div>`:''}</td>

                <td>${l.qty} ${it?esc(it.unit):''}</td>

            }).join('')}
            ${totalsRowsHtml(q.items, 'Total', 5, q.vatApplied)}

          </table>
          ${(()=>{
            const docs = docsForItems(q.items.map(l=>l.itemId));
            if(!docs.length) return '';
            return `<div style="margin-top:18px">
              <div class="sans" style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.7px">Supporting documents</div>

                ${docs.map(d=>{
                  const it = stockItemById(d.itemId);
                  const label = `${esc(docTypeLabel(d.type))}${it?' — '+esc(it.name):''}`;
                  return d.url

          ${q.status==='draft'?`<button class="btn" onclick="App.markQuoteSent('${q.id}')">Mark as sent</button>`:''}
          ${(q.status==='sent')?`<button class="btn ghost" onclick="App.setQuoteStatus('${q.id}','declined')">Declined</button>`:''}
          ${(q.status==='sent'||q.status==='draft')&&!q.orderId?`<button class="btn amber" onclick="App.convertQuoteToOrder('${q.id}')">Accepted — make it an order</button>`:''}
          ${q.orderId?`<button class="btn ghost" onclick="App.closeModal();App.go('orders')">View the order</button>`:''}
        </div>
      </div>`);
  },
  /* Pulls every uploaded document covering this quote's products, one after another,
     so they can be attached to an email by hand */
  async downloadQuoteDocs(id){
    const q = quoteById(id); if(!q) return;
    const docs = docsForItems(q.items.map(l=>l.itemId)).filter(d=>!d.url);
    if(!docs.length){ toast('No uploaded files on these products.', true); return; }
    toast('Fetching ' + docs.length + ' document' + (docs.length===1?'':'s') + '…');
    for(const d of docs){ await this.downloadDoc(d.id); await new Promise(r=>setTimeout(r, 600)); }
  },
  printQuote(){
    const area = $('#quotePrintArea'); if(!area) return;
    const w = window.open('', '_blank');
    w.document.write('<html><head><title>Quotation</title><style>'
      + 'body{font-family:Georgia,serif;padding:32px;color:#1e2a23}'
      + 'table{width:100%;border-collapse:collapse;margin-top:10px}'
      + 'th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #e2ded2;font-size:13px}'
      + 'th{font-family:Segoe UI,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#6b7a70}'
      + '.sans{font-family:Segoe UI,sans-serif}</style></head><body>'
      + area.innerHTML + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(()=>w.print(), 350);
  },

  /* =============== ACTIVITIES =============== */
  openActivityForm(id, preset){
    preset = preset || {};
    const a = id ? activityById(id) : null;
    const scope = a || preset;
    const dealOpts = ['<option value="">— none —</option>'].concat(
      store.deals.map(d=>`<option value="${d.id}" ${scope.dealId===d.id?'selected':''}>${esc(d.name)}</option>`)).join('');
    const conOpts = ['<option value="">— none —</option>'].concat(
      store.contacts.map(c=>`<option value="${c.id}" ${scope.contactId===c.id?'selected':''}>${esc(contactName(c))}</option>`)).join('');
    const compOpts = ['<option value="">— none —</option>'].concat(
      store.companies.map(c=>`<option value="${c.id}" ${scope.companyId===c.id?'selected':''}>${esc(c.name)}</option>`)).join('');
    this.modal(`
      <div class="modal">
        <h3>${a?'Edit activity':'Log activity'}</h3>
        <div class="f2">
          <div class="frow"><label>What happened</label><select id="ac_type">${
            ACTIVITY_TYPES.map(t=>`<option value="${t.k}" ${(a?a.type:'call')===t.k?'selected':''}>${t.icon} ${t.label}</option>`).join('')
          }</select></div>
          <div class="frow"><label>Date</label><input id="ac_at" type="date" value="${a&&a.at?a.at.slice(0,10):todayISO()}"></div>
        </div>
        <div class="frow"><label>Notes *</label><textarea id="ac_text" placeholder="e.g. Spoke to the buyer — wants a sample box before committing">${esc(a?a.text:'')}</textarea></div>
        <div class="f2">
          <div class="frow"><label>Deal</label><select id="ac_deal">${dealOpts}</select></div>
          <div class="frow"><label>Contact</label><select id="ac_contact">${conOpts}</select></div>
        </div>
        <div class="frow"><label>Company</label><select id="ac_company">${compOpts}</select></div>
        ${!a && scope.dealId ? `
        <div class="frow" style="border-top:1px solid var(--border);padding-top:12px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="ac_setNext" style="width:auto;margin:0" checked onchange="App.toggleNextFields()">
            <span>Also set the next step on this deal</span></label>
          <div id="ac_nextFields" class="f2" style="margin-top:8px">
            <div class="frow"><label>Next step</label><input id="ac_nextStep" placeholder="e.g. Chase sample feedback"></div>
            <div class="frow"><label>Due</label><input id="ac_nextDue" type="date" value="${addDaysISO(todayISO(), 7)}"></div>
          </div>
        </div>`:''}
        <div class="modal-actions">
          ${a?'<button class="btn danger small" style="margin-right:auto" onclick="App.deleteActivity(\''+a.id+'\')">Delete</button>':''}
          <button class="btn ghost" onclick="App.closeModal()">Cancel</button>
          <button class="btn" onclick="App.saveActivity('${a?a.id:''}')">${a?'Save activity':'Log it'}</button>
        </div>
      </div>`);
  },
  toggleNextFields(){
    const on = $('#ac_setNext').checked;
    $('#ac_nextFields').style.display = on ? '' : 'none';
  },
  saveActivity(id){
    const text = $('#ac_text').value.trim();
    if(!text){ toast('Add a line about what happened.', true); return; }
    const data = {
      type: $('#ac_type').value, at: $('#ac_at').value || todayISO(), text,
      dealId: $('#ac_deal').value||null, contactId: $('#ac_contact').value||null,
      companyId: $('#ac_company').value||null
    };
    /* An activity logged against a deal inherits that deal's company and contact,
       so it surfaces on their timelines even if they weren't picked explicitly. */
    if(data.dealId){
      const d = dealById(data.dealId);
      if(d){ if(!data.companyId) data.companyId = d.companyId||null;
             if(!data.contactId) data.contactId = d.contactId||null; }
    }
    if(id){ Object.assign(activityById(id), data); toast('Activity updated.'); }
    else {
      store.activities.push({id:uid(), createdAt:new Date().toISOString(), ...data});
      const setNext = $('#ac_setNext');
      if(setNext && setNext.checked && data.dealId){
        const d = dealById(data.dealId);
        const step = $('#ac_nextStep').value.trim();
        if(d && step){ d.nextStep = step; d.nextDue = $('#ac_nextDue').value || null; }
      }
      toast('Activity logged.');
    }
    save(); this.closeModal(); this.go(this.view, this.param);
  },
  deleteActivity(id){
    if(!confirm('Delete this activity?')) return;
    markDeleted(id);
    store.activities = store.activities.filter(a=>a.id!==id);
    save(); this.closeModal(); this.go(this.view, this.param);
  },
  /* Clear a deal's next step once it's done, prompting for the following one */
  completeNextStep(dealId){
    const d = dealById(dealId); if(!d) return;
    this.openActivityForm(null, {dealId:d.id, companyId:d.companyId, contactId:d.contactId});
    setTimeout(()=>{ const t=$('#ac_text'); if(t){ t.value = 'Done: '+d.nextStep; t.focus(); } }, 30);
  },

  /* =============== PRICING (scratchpad — writes only on save) =============== */
  pricingPick(id){ pricingSel = id; this.go('pricing'); },
  pricingReset(){ this.go('pricing'); },
  applyTargetMargin(){
    const it = stockItemById(pricingSel); if(!it) return;
    const target = Number($('#pr_target').value);
    if(!(target >= 0 && target < 100)){ toast('Enter a target margin between 0 and 99%.', true); return; }
    const cost = (Number($('#pr_cost').value)||0) + (it.costIsLanded ? 0 : (Number($('#pr_other').value)||0));
    if(!cost){ toast('Set a cost price first — margin is worked out from it.', true); return; }
    const p = priceForMargin(cost, target);
    const slider = $('#pr_price');
    if(p > Number(slider.max)) slider.max = (p*1.2).toFixed(2);
    slider.value = p.toFixed(2);
    refreshPricing();
    toast(`A ${target}% margin needs a trade price of ${fmtMoney(p)}.`);
  },
  pricingSave(){
    const it = stockItemById(pricingSel); if(!it) return;
    const cost  = Number($('#pr_cost').value)||0;
    const other = it.costIsLanded ? null : (Number($('#pr_other').value)||0);
    const price = Number($('#pr_price').value)||0;
    if(!confirm(`Save to ${it.name}?\n\n  Cost price: ${fmtMoney(cost)}`
      + (it.costIsLanded ? '  (landed)' : `\n  Other costs: ${fmtMoney(other)}`)
      + `\n  Trade price: ${fmtMoney(price)}\n\nThis updates the product. Existing orders keep the prices they were saved with.`)) return;
    it.costPrice = cost;
    if(!it.costIsLanded) it.otherCost = other;
    it.tradePrice = price;
    save(); this.go('pricing'); toast('Prices saved to '+it.name+'.');
  },

  saveStockItem(id){
    const name = $('#sk_name').value.trim();
    if(!name){ toast('Product name is required.', true); return; }
    const num = sel => { const v = $(sel).value.trim(); return v==='' ? null : Number(v); };
    const data = { name, unit:$('#sk_unit').value||'cases', onHand:Number($('#sk_onhand').value)||0,
      unitsPerCase:num('#sk_unitsPerCase'), unitSize:$('#sk_unitSize').value.trim(),
      caseWeight:num('#sk_caseWeight'), barcode:$('#sk_barcode').value.trim(),
      moq:num('#sk_moq'), orderMultiple:num('#sk_orderMultiple'),
      leadTimeDays:num('#sk_leadTimeDays'), reorderPoint:num('#sk_reorderPoint'), reorderQty:num('#sk_reorderQty'),
      costPrice:num('#sk_costPrice'), tradePrice:num('#sk_tradePrice'), rrp:num('#sk_rrp'),
      costIsLanded:$('#sk_costIsLanded').checked, otherCost:num('#sk_otherCost'),
      vatRate:$('#sk_vatRate').value,
      shelfLifeDays:num('#sk_shelfLifeDays'), storage:$('#sk_storage').value,
      origin:$('#sk_origin').value.trim(), allergens:$('#sk_allergens').value.trim(), specUrl:$('#sk_specUrl').value.trim(),
      supplier:$('#sk_supplier').value.trim(), notes:$('#sk_notes').value.trim() };
    if(data.moq!=null && data.orderMultiple && data.moq % data.orderMultiple !== 0){
      toast('Heads up: the MOQ isn’t a whole number of order multiples.', true);
    }
    if(id){ Object.assign(stockItemById(id), data); toast('Product updated.'); }
    else { store.stock.items.push({id:uid(), createdAt:new Date().toISOString(), ...data}); toast('Product added.'); }
    save(); this.closeModal(); this.go('stock');
  },
  deleteStockItem(id){
    if(!confirm('Delete this product? It will be removed from deals and incoming deliveries too.')) return;
    markDeleted(id);
    store.stock.incoming.filter(o=>o.itemId===id).forEach(o=>markDeleted(o.id));
    store.stock.items = store.stock.items.filter(i=>i.id!==id);
    store.stock.incoming = store.stock.incoming.filter(o=>o.itemId!==id);
    store.deals.forEach(d=>{ if(d.stockLines) d.stockLines = d.stockLines.filter(l=>l.itemId!==id); });
    save(); this.closeModal(); this.go('stock'); toast('Product deleted.');
  },
  openIncomingForm(){
    if(!store.stock.items.length){ toast('Add a product first.', true); return; }
    const opts = store.stock.items.map(it=>`<option value="${it.id}">${esc(it.name)} (${esc(it.unit)})</option>`).join('');
    const defaultDate = new Date(Date.now()+7*864e5).toISOString().slice(0,10);
    this.modal(`
      <div class="modal">
        <h3>Log incoming stock delivery</h3>
        <div class="frow"><label>Product</label><select id="in_item">${opts}</select></div>
        <div class="f2">
          <div class="frow"><label>Quantity</label><input id="in_qty" type="number" min="1"></div>
          <div class="frow"><label>Expected delivery date</label><input id="in_date" type="date" value="${defaultDate}"></div>
        </div>
        <div class="frow"><label>Supplier / reference</label><input id="in_supplier" placeholder="e.g. Shah Imports — PO 1088"></div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="App.closeModal()">Cancel</button>
          <button class="btn" onclick="App.saveIncoming()">Log delivery</button>
        </div>
      </div>`);

  saveIncoming(){
    const qty = Number($('#in_qty').value)||0;
    if(qty<=0){ toast('Enter a quantity.', true); return; }
    store.stock.incoming.push({id:uid(), itemId:$('#in_item').value, qty,
      expectedDate:$('#in_date').value||null, supplier:$('#in_supplier').value.trim(),
      received:false, createdAt:new Date().toISOString()});
    save(); this.closeModal(); this.go('stock'); toast('Incoming delivery logged.');
  },
  receiveIncoming(id){
    const o = store.stock.incoming.find(x=>x.id===id); if(!o || o.received) return;
    const it = stockItemById(o.itemId); if(!it){ toast('Product no longer exists.', true); return; }
    it.onHand += o.qty; o.received = true; o.receivedAt = new Date().toISOString();
    save(); this.go('stock'); toast(o.qty+' '+it.unit+' of '+it.name+' received into stock.');
  },
  deleteIncoming(id){
    if(!confirm('Remove this incoming delivery?')) return;
    markDeleted(id);
    store.stock.incoming = store.stock.incoming.filter(o=>o.id!==id);
    save(); this.go('stock'); toast('Delivery removed.');
  },

  /* =============== ORDERS =============== */
  addOrderLine(){
    $('#ol_rows').insertAdjacentHTML('beforeend', orderLineRowHtml(null));
    const row = $('#ol_rows').lastElementChild;
    this.onOrderLineItemChange(row.querySelector('.ol-item'));
  },
  /* When the SKU changes, pre-fill trade price and default the qty to the MOQ */
  onOrderLineItemChange(sel){
    const row = sel.closest('.ol-row');
    const it = stockItemById(sel.value);
    const priceEl = row.querySelector('.ol-price'), qtyEl = row.querySelector('.ol-qty');
    if(it && it.tradePrice!=null && !priceEl.value) priceEl.value = it.tradePrice;
    if(it && it.moq && !qtyEl.value) qtyEl.value = ceilToMultiple(it.moq, it.orderMultiple);
    this.checkOrderLine(sel);
  },
  /* Inline MOQ / multiple warning plus margin, per line */
  checkOrderLine(el){
    const row = el.closest('.ol-row');
    const it = stockItemById(row.querySelector('.ol-item').value);
    const qty = Number(row.querySelector('.ol-qty').value)||0;
    const price = Number(row.querySelector('.ol-price').value)||0;
    const note = row.querySelector('.ol-note');
    const parts = [];
    if(it){
      const pk = packLabel(it); if(pk) parts.push(esc(pk));
      const issue = qtyIssue(it, qty);
      if(issue){
        parts.push(`<span style="color:var(--red);font-weight:600">${qty} is ${esc(issue.msg)}</span>
          <button type="button" class="btn small ghost" style="padding:1px 7px;margin-left:4px"
            onclick="App.roundUpLine(this, ${issue.suggest})">Round up to ${issue.suggest}</button>`);
      }
      const m = lineMargin(it, price, qty);
      if(m && qty){
        const col = m.gp < 0 ? 'var(--red)' : 'var(--green-dark)';
        parts.push(`margin <span style="color:${col};font-weight:600">${fmtMoney(m.gp)} (${m.pct.toFixed(1)}%)</span>`);
      }
    }
    note.innerHTML = parts.join(' &nbsp;·&nbsp; ');
    this.refreshOrderTotals();
  },
  roundUpLine(btn, qty){
    const row = btn.closest('.ol-row');
    row.querySelector('.ol-qty').value = qty;
    this.checkOrderLine(row.querySelector('.ol-qty'));
  },
  /* Running order total + gross margin under the lines */
  refreshOrderTotals(){
    const el = $('#ol_totals'); if(!el) return;
    const items = [];
    document.querySelectorAll('#ol_rows .ol-row').forEach(r=>{
      const itemId = r.querySelector('.ol-item').value;
      const qty = Number(r.querySelector('.ol-qty').value)||0;
      const unitPrice = Number(r.querySelector('.ol-price').value)||0;
      if(itemId && qty>0) items.push({itemId, qty, unitPrice});
    });
    if(!items.length){ el.innerHTML = ''; return; }
    const m = orderMargin({items});
    const col = m.gp < 0 ? 'var(--red)' : 'var(--green-dark)';
    el.innerHTML = `<b>Order total ${fmtMoney(m.rev)}</b>`
      + (m.cost ? ` &nbsp;·&nbsp; cost ${fmtMoney(m.cost)} &nbsp;·&nbsp; gross margin
          <span style="color:${col};font-weight:700">${fmtMoney(m.gp)} (${m.pct.toFixed(1)}%)</span>` : '')
      + (m.known ? '' : ' <span style="color:var(--muted)">(some products have no cost price set)</span>');
  },
  prefillOrderFromCompany(){
    const rowsEl = $('#ol_rows'); if(!rowsEl || rowsEl.children.length) return;
    const co = companyById($('#of_company').value);
    if(!co || !co.stockEstimates || !co.stockEstimates.length) return;
    co.stockEstimates.forEach(l=> rowsEl.insertAdjacentHTML('beforeend', orderLineRowHtml(l)));
    toast('Order lines prefilled from '+co.name+"'s estimates — set quantities and prices.");
  },
  openOrderForm(id, presetCompanyId){
    if(!store.stock.items.length){ toast('Add your products in the Stock tab first — orders are built from SKUs.', true); return; }
    if(!store.companies.length){ toast('Add a company first — every order belongs to a company.', true); return; }
    const o = id ? orderById(id) : null;
    const compOpts = store.companies.map(co=>`<option value="${co.id}" ${(o?o.companyId:presetCompanyId)===co.id?'selected':''}>${esc(co.name)}</option>`).join('');
    const conOpts = ['<option value="">— none —</option>'].concat(
      store.contacts.map(c=>`<option value="${c.id}" ${o&&o.contactId===c.id?'selected':''}>${esc(contactName(c))}</option>`)).join('');
    this.modal(`
      <div class="modal">
        <h3>${o?'Edit order':'New confirmed order'}</h3>
        <div class="f2">
          <div class="frow"><label>Company *</label><select id="of_company" onchange="App.prefillOrderFromCompany()">${compOpts}</select></div>
          <div class="frow"><label>Contact</label><select id="of_contact">${conOpts}</select></div>
        </div>
        <div class="f2">
          <div class="frow"><label>Order / PO reference</label><input id="of_ref" placeholder="e.g. PO-2091" value="${esc(o?o.ref:'')}"></div>
          <div class="frow"><label>Order date</label><input id="of_date" type="date" value="${o?o.orderDate:todayISO()}"></div>
        </div>
        <div class="frow"><label>Delivery date (optional)</label><input id="of_delivery" type="date" value="${esc(o&&o.deliveryDate?o.deliveryDate:'')}"></div>
        <div class="frow"><label>Order lines (SKU × quantity × unit price)</label>
          <div id="ol_rows">${(o&&o.items?o.items:[]).map(l=>orderLineRowHtml(l)).join('')}</div>
          <button type="button" class="btn small ghost" onclick="App.addOrderLine()">+ Add SKU</button>
          <div id="ol_totals" style="margin-top:9px;font-family:'Segoe UI',sans-serif;font-size:13px"></div>
          <div class="hint">Quantities are checked against each product's minimum order quantity and order multiple. Prices pre-fill from the trade price.</div>
        </div>
        <div class="modal-actions">
          ${o?'<button class="btn danger small" style="margin-right:auto" onclick="App.deleteOrder(\''+o.id+'\')">Delete</button>':''}
          <button class="btn ghost" onclick="App.closeModal()">Cancel</button>
          <button class="btn" onclick="App.saveOrder('${o?o.id:''}')">${o?'Save order':'Save confirmed order'}</button>
        </div>
      </div>`);
    if(!o && presetCompanyId) this.prefillOrderFromCompany();
    document.querySelectorAll('#ol_rows .ol-row .ol-qty').forEach(q=>this.checkOrderLine(q));
    this.refreshOrderTotals();
  },
  saveOrder(id){
    const companyId = $('#of_company').value;
    if(!companyId){ toast('Choose a company.', true); return; }
    const items = [];
    document.querySelectorAll('#ol_rows .ol-row').forEach(r=>{
      const itemId = r.querySelector('.ol-item').value;
      const qty = Number(r.querySelector('.ol-qty').value)||0;
      const unitPrice = Number(r.querySelector('.ol-price').value)||0;
      if(itemId && qty>0) items.push({itemId, qty, unitPrice});
    });
    if(!items.length){ toast('Add at least one order line with a quantity.', true); return; }
    /* MOQ / order-multiple check — warn and confirm, never block */
    const breaches = items.map(l=>{
      const it = stockItemById(l.itemId); const iss = qtyIssue(it, l.qty);
      return iss ? `${it.name}: ${l.qty} is ${iss.msg}` : null;
    }).filter(Boolean);
    if(breaches.length && !confirm('These lines break your ordering rules:\n\n  ' + breaches.join('\n  ')
        + '\n\nSave the order anyway?')) return;
    const data = { companyId, contactId:$('#of_contact').value||null, ref:$('#of_ref').value.trim(),
      orderDate:$('#of_date').value||todayISO(), deliveryDate:$('#of_delivery').value||null, items };
    if(id){
      const o = orderById(id);
      Object.assign(o, data);
      const inv = invoiceForOrder(id);
      if(inv && !inv.paidAt){
        const vb = vatBreakdown(o.items, inv.vatApplied);
        inv.amount = vb.net; inv.vat = vb.vat; inv.total = vb.gross;
      }
      save(); this.closeModal(); this.go(this.view, this.param); toast('Order updated.');
    } else {
      const o = {id:uid(), createdAt:new Date().toISOString(), status:'confirmed', ...data};
      store.orders.push(o);
      save();
      this.openInvoicePrompt(o.id);
    }
  },
  deleteOrder(id){
    const inv = invoiceForOrder(id);
    if(!confirm('Delete this order'+(inv?' and its invoice '+inv.number:'')+'?')) return;
    markDeleted(id);
    if(inv) markDeleted(inv.id);
    store.orders = store.orders.filter(o=>o.id!==id);
    store.invoices = store.invoices.filter(i=>i.orderId!==id);
    save(); this.closeModal(); this.go('orders'); toast('Order deleted.');
  },
  fulfillOrder(id){
    const o = orderById(id); if(!o || o.status==='fulfilled') return;
    if(!confirm('Mark this order as delivered? Quantities will be deducted from stock on hand.')) return;
    o.items.forEach(l=>{ const it = stockItemById(l.itemId); if(it) it.onHand -= l.qty; });
    o.status='fulfilled'; o.fulfilledAt = new Date().toISOString();
    save(); this.go(this.view, this.param); toast('Order fulfilled — stock deducted.');
  },

  /* =============== INVOICES =============== */
  createInvoice(orderId, opts){
    opts = opts||{};
    const o = orderById(orderId);
    const existing = invoiceForOrder(orderId);
    if(existing) return existing;
    store.counters.invoice = (store.counters.invoice||0) + 1;
    const num = 'INV-' + String(store.counters.invoice).padStart(4,'0');
    const terms = Number((store.settings.invoice||{}).termsDays)||30;
    const vb = vatBreakdown(o.items);
    const inv = {id:uid(), number:num, orderId, companyId:o.companyId,
      issueDate:todayISO(), dueDate:addDaysISO(todayISO(), terms), amount:vb.net,
      vatApplied: vatRegistered(), vat: vb.vat, total: vb.gross,
      sentAt:null, paidAt:null, remindAt: opts.remindHours ? new Date(Date.now()+opts.remindHours*3600e3).toISOString() : null,
      createdAt:new Date().toISOString()};
    store.invoices.push(inv);
    save();
    return inv;
  },
  openInvoicePrompt(orderId){
    const o = orderById(orderId);
    const co = companyById(o.companyId);
    this.modal(`
      <div class="modal">

  async enablePush(){
    try{
      if(!('Notification' in window) || !('PushManager' in window)){
        toast('Push isn\'t supported in this browser. On iPhone, install the app to your Home Screen first.', true); return;
      }
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){ this.go('settings'); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({userVisibleOnly:true,
        applicationServerKey:(b64=>{const pad='='.repeat((4-b64.length%4)%4);
          const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
          return Uint8Array.from(raw, c=>c.charCodeAt(0));})(VAPID_PUBLIC)});
      let did = localStorage.getItem(DEVICE_KEY);
      if(!did){ did = uid(); localStorage.setItem(DEVICE_KEY, did); }
      store.push = store.push||[];
      const label = /Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Phone' : 'Laptop';
      const rec = {id:did, name:label, sub:sub.toJSON(), updatedAt:Date.now()};
      const existing = store.push.find(x=>x.id===did);
      if(existing) Object.assign(existing, rec); else store.push.push(rec);
      save(); this.go('settings'); toast('Notifications enabled on this device.'); doSync(true);
    }catch(e){ toast('Could not enable notifications: '+e.message, true); }
  },
