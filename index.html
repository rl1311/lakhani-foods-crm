  async generateLeads(){
    const desc = $('#lg_desc').value.trim();
    if(!desc){ toast('Describe your target client base first.', true); return; }
    const keyInput = $('#lg_key');
    if(keyInput && keyInput.value.trim()){ store.settings.apiKey = keyInput.value.trim(); save(); }
    if(!store.settings.apiKey){ toast('An Anthropic API key is needed to ask Claude.', true); return; }

    const region = $('#lg_region').value.trim() || 'United Kingdom';
    const count = Number($('#lg_count').value)||5;
    const typical = Number($('#lg_value').value)||10000;
    const btn = $('#lg_go');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Asking Claude…';
    $('#lg_results').innerHTML = '';

    const schema = {
      type:'object',
      properties:{
        leads:{ type:'array', items:{
          type:'object',
          properties:{
            companyName:{type:'string'},
            industry:{type:'string'},
            location:{type:'string'},
            contactName:{type:'string', description:'A plausible full name for the likely buyer persona'},
            contactRole:{type:'string', description:'Job title of the likely buyer, e.g. Head of Procurement'},
            estimatedValue:{type:'number', description:'Estimated first-deal value'},
            rationale:{type:'string', description:'One sentence on why this prospect fits'}
          },
          required:['companyName','industry','location','contactName','contactRole','estimatedValue','rationale'],
          additionalProperties:false
        }}
      },
      required:['leads'], additionalProperties:false
    };

    const prompt =
`You are a B2B sales researcher for ${store.settings.companyName||'Lakhani Foods Ltd'}, a food products company.

Suggest exactly ${count} realistic prospect leads matching this ideal client profile:
"${desc}"

Region / market: ${region}
Typical first-deal value: around ${store.settings.currency}${typical} (vary it plausibly per lead, from roughly half to double).

For each lead give: a realistic company profile of the kind that exists in this market (a plausible company name and location — these are illustrative prospect archetypes for the user to research and verify), the likely buyer persona (a plausible contact name and job title), an estimated first-deal value as a plain number, and a one-sentence rationale for the fit.`;

    try{
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key': store.settings.apiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body: JSON.stringify({
          model:'claude-opus-4-8',
          max_tokens:8000,
          output_config:{format:{type:'json_schema', schema}},
          messages:[{role:'user', content:prompt}]
        })
      });
      const body = await res.json();
      if(!res.ok){
        const msg = (body && body.error && body.error.message) || ('HTTP '+res.status);
        throw new Error(msg);
      }
      if(body.stop_reason === 'refusal'){ throw new Error('Claude declined this request. Try rewording your description.'); }
      const textBlock = (body.content||[]).find(b=>b.type==='text');
      const parsed = JSON.parse(textBlock.text);
      this._aiLeads = parsed.leads || [];
      this.renderAiResults();
    }catch(err){
      $('#lg_results').innerHTML = `<div class="banner" style="background:var(--red-soft);border-color:#e6b8b2;color:var(--red)">
        <b>Couldn't generate leads:</b> ${esc(err.message)}</div>`;
    }finally{
      btn.disabled = false; btn.textContent = 'Generate leads';
    }
  },

  renderAiResults(){
    const leads = this._aiLeads || [];
    if(!leads.length){ $('#lg_results').innerHTML = '<div class="banner">Claude returned no leads — try a more specific description.</div>'; return; }
    $('#lg_results').innerHTML = `
      <div style="margin:14px 0 8px;font-weight:600;font-family:'Segoe UI',sans-serif;font-size:13.5px">
        Claude suggested ${leads.length} lead${leads.length>1?'s':''} — untick any you don't want:</div>
      ${leads.map((l,i)=>`
        <div class="ai-lead-row">
          <input type="checkbox" id="ai_${i}" checked>
          <div>
            <div style="font-weight:600">${esc(l.companyName)} <span class="pill grey">${esc(l.location)}</span></div>
            <div style="font-size:12.5px;color:var(--muted)">${esc(l.contactName)} — ${esc(l.contactRole)} · ${esc(l.industry)} · est. ${fmt(l.estimatedValue)}</div>
            <div style="font-size:12.5px;margin-top:3px">${esc(l.rationale)}</div>
          </div>
        </div>`).join('')}
      <button class="btn" style="margin-top:8px" onclick="App.acceptAiLeads()">Add selected to pipeline</button>`;
  },

  acceptAiLeads(){
    const leads = this._aiLeads || [];
    let added = 0;
    leads.forEach((l,i)=>{
      const cb = $('#ai_'+i);
      if(!cb || !cb.checked) return;
      // company (reuse if same name exists)
      let comp = store.companies.find(c=>c.name.toLowerCase()===l.companyName.toLowerCase());
      if(!comp){
        comp = {id:uid(), createdAt:new Date().toISOString(), name:l.companyName, industry:l.industry||'',
          location:l.location||'', website:'', notes:'Suggested by Claude — verify before outreach.'};
        store.companies.push(comp);
      }
      const nameParts = (l.contactName||'').split(/\s+/);
      const contact = {id:uid(), createdAt:new Date().toISOString(), firstName:nameParts[0]||'Contact',
        lastName:nameParts.slice(1).join(' '), role:l.contactRole||'', companyId:comp.id, email:'', phone:'',
        notes:'AI-suggested buyer persona — verify the real contact at this company.'};
      store.contacts.push(contact);
      store.deals.push({id:uid(), createdAt:new Date().toISOString(), name:'New business — '+l.companyName,
        companyId:comp.id, contactId:contact.id, value:Number(l.estimatedValue)||0, stage:'New Lead',
        status:'open', closedAt:null, source:'claude', nextStep:'Research & verify this prospect', notes:[
          {at:new Date().toISOString(), text:'AI rationale: '+(l.rationale||'')}
        ]});
      added++;
    });
    save(); this.closeModal(); this.go('pipeline');
    toast(added + ' AI-suggested lead'+(added===1?'':'s')+' added to the pipeline.');
  },

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lakhani-foods-crm-backup-' + new Date().toISOString().slice(0,10) + '.json';

    try{
      const d = JSON.parse(await f.text());
      if(!d.deals || !d.contacts) throw new Error('bad file');
      if(!confirm('Replace all current CRM data with this backup?')) return;
      store = {...freshData(), ...d};
      save(); this.go('dashboard'); toast('Backup restored.');

    if(!confirm('Delete ALL CRM data (contacts, companies, leads, orders, invoices, stock, bank data)? If sync is connected this clears the shared store too, on every device. This cannot be undone.')) return;

    save(); this.go('dashboard'); toast('All data cleared.');
  }

   a contact or a company. A deal's activity also shows on its company and contact. */

  {k:'call',    label:'Call',        icon:'☎️'},

];

function activityById(id){ return (store.activities||[]).find(a=>a.id===id); }

/* Activities relevant to a record. A company sees everything from its deals and its
   people; a contact sees its own and its deals'; a deal sees only its own. */
function activitiesFor(scope){
  const acts = store.activities || [];
  let list;
  if(scope.dealId){
    list = acts.filter(a=>a.dealId===scope.dealId);
  } else if(scope.contactId){
    const dealIds = new Set(store.deals.filter(d=>d.contactId===scope.contactId).map(d=>d.id));
    list = acts.filter(a=>a.contactId===scope.contactId || dealIds.has(a.dealId));
  } else if(scope.companyId){
    const dealIds = new Set(store.deals.filter(d=>d.companyId===scope.companyId).map(d=>d.id));
    const conIds  = new Set(store.contacts.filter(c=>c.companyId===scope.companyId).map(c=>c.id));
    list = acts.filter(a=>a.companyId===scope.companyId || dealIds.has(a.dealId) || conIds.has(a.contactId));
  } else {
    list = acts.slice();
  }
  return list.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
}
function lastActivityAt(scope){ const l = activitiesFor(scope); return l.length ? l[0].at : null; }
function daysSince(iso){
  if(!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
}
function activityTimelineHtml(list, opts){

/* ---------------- Next actions ----------------
   Every open deal should carry a next step and a date. These drive the dashboard. */
function dealDueState(d){
  if(d.status!=='open') return null;
  if(!d.nextStep) return {cls:'grey', txt:'No next step', order:1};
  if(!d.nextDue)   return {cls:'grey', txt:'No date set',  order:2};
  const today = todayISO();
  if(d.nextDue <  today) return {cls:'red',   txt:'Overdue',   order:0};
  if(d.nextDue === today) return {cls:'amber', txt:'Due today', order:0};
  return {cls:'green', txt:'Due '+fdate(d.nextDue), order:3};
}
function dealsNeedingAttention(){
  const today = todayISO();
  const open = store.deals.filter(d=>d.status==='open');
  return {
    overdue:  open.filter(d=>d.nextDue && d.nextDue <  today).sort((a,b)=>a.nextDue.localeCompare(b.nextDue)),
    today:    open.filter(d=>d.nextDue && d.nextDue === today),

  };

function stockItemById(id){ return store.stock.items.find(i=>i.id===id); }

/* ---- Product packing / ordering helpers ---- */
function packLabel(it){
  if(!it) return '';
  const bits = [];
  if(it.unitsPerCase) bits.push(it.unitsPerCase + ' × ' + (it.unitSize || 'unit'));
  else if(it.unitSize) bits.push(it.unitSize);
  if(it.caseWeight) bits.push(it.caseWeight + 'kg');
  return bits.join(' · ');
}
function orderRuleLabel(it){
  if(!it) return '';
  const bits = [];
  if(it.moq) bits.push('MOQ ' + it.moq);
  if(it.orderMultiple) bits.push('in ' + it.orderMultiple + 's');
  if(it.leadTimeDays) bits.push(it.leadTimeDays + 'd lead');
  return bits.join(' · ');
}
/* Returns null if the quantity is fine, otherwise a warning + the nearest valid quantity up */
function qtyIssue(it, qty){
  if(!it || !qty) return null;
  if(it.moq && qty < it.moq) return {msg:'below MOQ of ' + it.moq, suggest:ceilToMultiple(it.moq, it.orderMultiple)};
  if(it.orderMultiple && qty % it.orderMultiple !== 0){
    return {msg:'not a multiple of ' + it.orderMultiple, suggest:ceilToMultiple(qty, it.orderMultiple)};
  }
  return null;
}
function ceilToMultiple(n, m){ return m ? Math.ceil(n/m)*m : n; }
/* How much to actually order: at least the shortfall, rounded up to a whole purchase multiple,
   and never less than the reorder quantity if one is set */
/* The earliest date this product is actually needed, taken from the expected close
   dates of the open deals that demand it. Null when no such deal carries a date. */
function neededBy(it){
  const dates = store.deals
    .filter(d=>d.status==='open' && d.closeDate && dealQtyFor(d, it.id) > 0)
    .map(d=>d.closeDate).sort();
  return dates.length ? dates[0] : null;
}
/* Latest date the supplier order can go out and still arrive in time */
function orderByDate(it){
  const need = neededBy(it);
  if(!need || it.leadTimeDays==null) return null;
  return addDaysISO(need, -it.leadTimeDays);
}
function orderQtyAdvice(it, shortfall){
  let q = ceilToMultiple(shortfall, it.orderMultiple);
  if(it.reorderQty && it.reorderQty > q) q = it.reorderQty;
  return q;
}
/* True all-in cost per unit. If the saved cost is flagged as landed it stands alone,
   otherwise the separately-entered other costs are added to it. */
function landedCost(it){
  if(!it || it.costPrice==null) return null;
  return it.costIsLanded ? it.costPrice : it.costPrice + (it.otherCost || 0);
}
function marginPct(cost, price){ return price ? ((price - cost) / price * 100) : 0; }
/* "cases" -> "case", for per-unit labels */
function unitSingular(u){ return String(u||'unit').replace(/s$/,''); }
/* Trade price needed to hit a target gross margin percentage */
function priceForMargin(cost, pct){ return pct >= 100 ? null : cost / (1 - pct/100); }
function lineMargin(it, unitPrice, qty){
  const c = landedCost(it);
  if(c==null) return null;
  const cost = c * qty, rev = (unitPrice||0) * qty;
  return {cost, rev, gp:rev-cost, pct: marginPct(cost, rev)};
}
function orderMargin(o){
  let cost=0, rev=0, known=true;
  (o.items||[]).forEach(l=>{
    const it = stockItemById(l.itemId);
    const c = landedCost(it);
    rev += l.qty * (l.unitPrice||0);
    if(c!=null) cost += l.qty * c; else known=false;
  });
  return {cost, rev, gp:rev-cost, pct: marginPct(cost, rev), known};
}
/* Products whose free stock has fallen to or below their reorder point */
function reorderDue(){
  return store.stock.items.filter(it=>{
    if(it.reorderPoint==null) return false;
    const s = stockStats(it);
    return (s.availableNow + s.incoming) <= it.reorderPoint;
  });
}
/* A deal's stock demand: exact lines if set, otherwise the company's estimated requirement */
function effectiveLines(deal){
  if(deal.stockLines && deal.stockLines.length) return {lines:deal.stockLines, estimated:false};
  if(deal.companyId){
    const co = companyById(deal.companyId);
    if(co && co.stockEstimates && co.stockEstimates.length) return {lines:co.stockEstimates, estimated:true};
  }
  return {lines:[], estimated:false};
}
function dealQtyFor(deal, itemId){ return effectiveLines(deal).lines.filter(l=>l.itemId===itemId).reduce((s,l)=>s+l.qty,0); }
function stockStats(item){
  const wonDeals  = store.deals.filter(d=>d.status==='won' && !d.fulfilled);
  const openDeals = store.deals.filter(d=>d.status==='open');
  const committed  = wonDeals.reduce((s,d)=>s+dealQtyFor(d,item.id),0);
  const openDemand = openDeals.reduce((s,d)=>s+dealQtyFor(d,item.id),0);
  const weightedDemand = openDeals.reduce((s,d)=>s+dealQtyFor(d,item.id)*(STAGE_PROB[d.stage]||0.1),0);
  const pending  = store.stock.incoming.filter(o=>o.itemId===item.id && !o.received)
                    .sort((a,b)=>(a.expectedDate||'').localeCompare(b.expectedDate||''));
  const incoming = pending.reduce((s,o)=>s+o.qty,0);
  const availableNow = item.onHand - committed;               // free stock after won-but-undelivered deals
  const projectedAll = item.onHand + incoming - committed - openDemand; // if every open deal closes
  return {committed, openDemand, weightedDemand, incoming, availableNow, projectedAll, pending};
}
function stockStatus(st){
  if(st.availableNow < 0) return {cls:'red', txt:'Oversold'};
  if(st.projectedAll < 0) return {cls:'red', txt:'Shortfall'};
  if(st.openDemand > 0 && st.availableNow < st.openDemand) return {cls:'amber', txt:'Needs deliveries'};
  return {cls:'green', txt:'OK'};
}

function statPack(){
  const open = store.deals.filter(d=>d.status==='open');
  const won  = store.deals.filter(d=>d.status==='won');
  const lost = store.deals.filter(d=>d.status==='lost');
  const pipelineValue = open.reduce((s,d)=>s+d.value,0);
  const weighted = open.reduce((s,d)=>s+d.value*(STAGE_PROB[d.stage]||0.1),0);
  const wonValue = won.reduce((s,d)=>s+d.value,0);
  const winRate = (won.length+lost.length) ? Math.round(100*won.length/(won.length+lost.length)) : null;
  return {open, won, lost, pipelineValue, weighted, wonValue, winRate};
}

        ? `<div class="card kpi" style="border-left:4px solid var(--red)"><div class="lbl">Stock coverage</div><div class="val" style="color:var(--red)">${short} short</div><div class="note"><a class="lnk" onclick="App.go('stock')">See shortfalls</a> if pipeline closes</div></div>`
        : `<div class="card kpi"><div class="lbl">Stock coverage</div><div class="val" style="color:var(--green-dark)">OK</div><div class="note">pipeline coverable from stock</div></div>`;
    })() : ''}
  </div>

  ${noData ? `<div class="card empty">
      <div class="big">&#127793;</div>
      <p><b>Your CRM is ready — the pipeline is empty.</b></p>
      <p style="margin-top:6px">Add your first lead, or let Claude suggest prospects that fit your client base.</p>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:center">
        <button class="btn" onclick="App.openDealForm()">+ Add a lead</button>
        <button class="btn amber" onclick="App.openLeadGen()">&#10024; Ask Claude</button>
      </div>
    </div>` : `
  <div class="chart-grid">
    <div class="card"><div class="chart-title">Leads by pipeline stage</div>${svgBars(funnel, '#1e5c40')}</div>
    <div class="card"><div class="chart-title">Deal outcomes</div>${svgDonut([
        {label:'Open', value:s.open.length, color:'#2b6cb0'},
        {label:'Won', value:s.won.length, color:'#1e5c40'},
        {label:'Lost', value:s.lost.length, color:'#b03a2e'}])}</div>
    <div class="card"><div class="chart-title">New leads per month</div>${svgLine(leadsSeries, '#d98324')}</div>
    <div class="card"><div class="chart-title">Revenue won per month</div>${svgBars(wonSeries, '#d98324', true)}</div>
    ${(()=>{
      /* Weighted forecast by expected close month — only deals that carry a close date */
      const dated = store.deals.filter(d=>d.status==='open' && d.closeDate);
      if(!dated.length) return `<div class="card"><div class="chart-title">Forecast by close month</div>
        <div style="color:var(--muted);font-size:13px;font-family:sans-serif">
          Set an expected close date on your open deals and this shows the weighted forecast month by month.</div></div>`;
      const fm = [];
      const base = new Date(); base.setDate(1);
      for(let i=0;i<6;i++){
        const dt = new Date(base.getFullYear(), base.getMonth()+i, 1);
        const k = monthKey(dt.toISOString());
        fm.push({label: monthLabel(k),
          value: dated.filter(d=>monthKey(d.closeDate)===k)
                      .reduce((x,d)=>x + d.value*(STAGE_PROB[d.stage]||0), 0)});
      }
      const undated = store.deals.filter(d=>d.status==='open' && !d.closeDate).length;
      return `<div class="card"><div class="chart-title">Weighted forecast by close month</div>
        ${svgBars(fm, '#1e5c40', true)}
        ${undated?`<div style="font-size:11.5px;color:var(--muted);font-family:sans-serif;margin-top:6px">
          ${undated} open deal${undated===1?'':'s'} ${undated===1?'has':'have'} no close date and ${undated===1?'is':'are'} not counted here.</div>`:''}
      </div>`;
    })()}
    ${topCompanies.length? `<div class="card" style="grid-column:1/-1"><div class="chart-title">Top companies by deal value (open + won)</div>${svgHBars(topCompanies)}</div>`:''}
  </div>`}
  `;
}

/* ---------------- Pipeline ---------------- */
function renderPipeline(){
  const cols = STAGES.map(stage=>{
    const deals = store.deals.filter(d=>{
      if(d.status==='lost') return false;
      if(stage==='Closed Won') return d.stage==='Closed Won' && d.status==='won';
      return d.stage===stage && d.status==='open';
    });
    const total = deals.reduce((s,d)=>s+d.value,0);
    return `
    <div class="col" data-stage="${esc(stage)}">
      <div class="col-head"><span class="t">${esc(stage)}</span><span class="n">${deals.length}</span></div>
      <div class="col-sum">${fmt(total)} · ${Math.round((STAGE_PROB[stage]||0)*100)}% likely</div>
      ${deals.map(d=>{
        const comp = d.companyId ? companyById(d.companyId) : null;
        return `<div class="deal" draggable="true" data-id="${d.id}" onclick="App.go('deal','${d.id}')">
          <div class="dn">${esc(d.name)}</div>
          <div class="dc">${comp?esc(comp.name):'No company'}</div>
          <div class="dv">${fmt(d.value)}</div>
          ${d.nextStep?`<div class="dc" style="margin-top:5px">&rarr; ${esc(d.nextStep)}</div>`:''}
          <div class="tags">${(()=>{ const st = dealDueState(d);
              return st && (st.cls==='red'||st.cls==='amber'||!d.nextStep) ? `<span class="pill ${st.cls}">${esc(st.txt)}</span> ` : ''; })()
            }${d.source==='claude'?'<span class="pill amber">AI suggested</span> ':''}${d.status==='won'?'<span class="pill green">Won</span>':''}</div>
        </div>`;
      }).join('') || '<div style="color:#a9a48f;font-size:12.5px;font-family:sans-serif;padding:8px 2px">Drop leads here</div>'}
    </div>`;
  }).join('');

  const lost = store.deals.filter(d=>d.status==='lost');

  return `
  <div class="page-head">
    <div><h2>Lead pipeline</h2>
    <div class="sub">Drag leads between stages. Dropping into <b>Closed Won</b> marks the deal as won.</div></div>
    <div style="display:flex;gap:10px">
      <button class="btn amber" onclick="App.openLeadGen()">&#10024; Ask Claude to generate leads</button>
      <button class="btn" onclick="App.openDealForm()">+ New lead</button>
    </div>
  </div>
  <div class="board">${cols}</div>
  ${lost.length? `<div class="card" style="margin-top:18px">
    <div class="chart-title">Lost deals (${lost.length})</div>
    <table><thead><tr><th>Deal</th><th>Company</th><th>Value</th><th>Lost on</th><th></th></tr></thead><tbody>
    ${lost.map(d=>`<tr class="clickable" onclick="App.go('deal','${d.id}')">
      <td>${esc(d.name)}</td><td>${d.companyId?esc((companyById(d.companyId)||{}).name||'—'):'—'}</td>
      <td>${fmt(d.value)}</td><td>${fdate(d.closedAt)}</td>
      <td><button class="btn small ghost" onclick="event.stopPropagation();App.reopenDeal('${d.id}')">Reopen</button></td></tr>`).join('')}
    </tbody></table></div>`:''}
  `;
}

function wireDragDrop(){
  document.querySelectorAll('.deal[draggable]').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', el.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
    });
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('drag-over'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if(id) App.moveDeal(id, col.dataset.stage);
    });
  });
}

      <div style="margin-top:18px">
        <div class="section-title">Stock required ${d.fulfilled?'<span class="pill green">Delivered</span>':''} ${el.estimated?'<span class="pill amber">estimated from company</span>':''}</div>
        <table><thead><tr><th>Product</th><th>Qty</th><th>Coverage</th></tr></thead><tbody>

          const it = stockItemById(l.itemId);
          if(!it) return `<tr><td colspan="3" style="color:var(--muted)">A linked product was deleted.</td></tr>`;
          const s = stockStats(it);
          let pill;
          if(d.fulfilled) pill = '<span class="pill grey">deducted</span>';

      </div>

    </div>
  </div>`;
}

function parseCsvTransactions(text){
  const out = [];
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const parts = line.split(',').map(p=>p.trim().replace(/^"|"$/g,''));
    if(parts.length < 3) return;
    const amount = Number(parts[parts.length-1].replace(/[£$€,\s]/g,''));
    if(isNaN(amount)) return; // header row or bad line
    const dateRaw = parts[0];
    const d = new Date(dateRaw);
    const date = isNaN(d.getTime()) ? null : d.toISOString();
    out.push({id:uid(), date, desc: parts.slice(1,-1).join(', ') || 'Transaction', amount});
  });
  return out.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
}

/* ---------------- Stock ---------------- */
function renderStock(){
  const items = store.stock.items;
  const pendingAll = store.stock.incoming.filter(o=>!o.received)
    .sort((a,b)=>(a.expectedDate||'9999').localeCompare(b.expectedDate||'9999'));
  const receivedRecent = store.stock.incoming.filter(o=>o.received).slice(-5).reverse();

  if(!items.length){
    return `
    <div class="page-head"><div><h2>Stock holding</h2>
      <div class="sub">Track products, incoming deliveries and whether you can cover the deals in your pipeline.</div></div></div>
    <div class="card empty">
      <div class="big">&#128230;</div>
      <p><b>No products yet.</b></p>
      <p style="margin-top:6px;max-width:520px;margin-left:auto;margin-right:auto">
        Add the products you hold (spice ranges, rice, frozen lines…), then link quantities to your deals.
        The CRM will show available stock, what's committed to won deals, and any shortfall if your pipeline closes.</p>
      <button class="btn" style="margin-top:16px" onclick="App.openStockForm()">+ Add your first product</button>
    </div>`;
  }

  const statsMap = {};
  items.forEach(it=>{ statsMap[it.id] = stockStats(it); });
  const shortfalls = items.filter(it=>{ const s=statsMap[it.id]; return s.projectedAll<0 || s.availableNow<0; });
  const needsDeliveries = items.filter(it=>{ const s=statsMap[it.id]; return s.projectedAll>=0 && s.availableNow>=0 && s.openDemand>0 && s.availableNow<s.openDemand; });
  const nextDelivery = pendingAll.length ? pendingAll[0] : null;

  const rows = items.map(it=>{
    const s = statsMap[it.id];
    const pill = stockStatus(s);
    return `<tr>
      <td><b>${esc(it.name)}</b>
        ${it.supplier?`<div style="font-size:11.5px;color:var(--muted)">from ${esc(it.supplier)}</div>`:''}
        <div style="font-size:11px;color:var(--muted)">${esc(it.storage||'Ambient')}${it.origin?' · '+esc(it.origin):''}${
          it.specUrl?` · <a class="lnk" href="${esc(it.specUrl)}" target="_blank" rel="noopener">spec</a>`:''}</div></td>
      <td>${esc(it.unit)}${packLabel(it)?`<div style="font-size:11px;color:var(--muted)">${esc(packLabel(it))}</div>`:''}${
        orderRuleLabel(it)?`<div style="font-size:11px;color:var(--muted)">${esc(orderRuleLabel(it))}</div>`:''}</td>
      <td><b>${it.onHand}</b>${it.reorderPoint!=null&&(s.availableNow+s.incoming)<=it.reorderPoint?'<div><span class="pill amber">reorder</span></div>':''}</td>
      <td>${s.committed||'—'}</td>
      <td style="color:${s.availableNow<0?'var(--red)':'inherit'};font-weight:600">${s.availableNow}</td>
      <td>${s.openDemand||'—'}${s.openDemand?`<div style="font-size:11px;color:var(--muted)">~${Math.round(s.weightedDemand)} weighted</div>`:''}</td>
      <td>${s.incoming?('+'+s.incoming):'—'}</td>
      <td style="color:${s.projectedAll<0?'var(--red)':'var(--green-dark)'};font-weight:700">${s.projectedAll}</td>
      <td><span class="pill ${pill.cls}">${pill.txt}</span></td>
      <td style="white-space:nowrap">
        <button class="btn small ghost" onclick="App.openStockForm('${it.id}')">Edit</button>
        <button class="btn small ghost" onclick="App.openDocs('${it.id}')">Docs${
          (()=>{ const n = docsForItem(it.id).length; return n?` (${n})`:''; })()}</button>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="page-head">
    <div><h2>Stock holding</h2>
    <div class="sub">Can you cover your pipeline? Committed = won deals awaiting delivery. Projected = on hand + incoming − committed − open pipeline.</div></div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" onclick="App.openIncomingForm()">+ Log incoming delivery</button>
      <button class="btn" onclick="App.openStockForm()">+ Add product</button>
    </div>
  </div>

  <div class="grid kpis" style="margin-bottom:16px">
    <div class="card kpi"><div class="lbl">Products tracked</div><div class="val">${items.length}</div></div>
    <div class="card kpi"><div class="lbl">Shortfalls if pipeline closes</div>
      <div class="val" style="color:${shortfalls.length?'var(--red)':'var(--green-dark)'}">${shortfalls.length}</div>
      <div class="note">${shortfalls.length?'action needed — see below':'all deals coverable'}</div></div>
    <div class="card kpi"><div class="lbl">Pending deliveries</div><div class="val">${pendingAll.length}</div>
      <div class="note">${nextDelivery?('next: '+fdate(nextDelivery.expectedDate)):'none scheduled'}</div></div>
  </div>

  ${shortfalls.length? `<div class="card" style="margin-bottom:16px;border-left:4px solid var(--red)">
    <div class="section-title" style="color:var(--red)">&#9888;&#65039; Stock shortfalls</div>
    ${shortfalls.map(it=>{
      const s = statsMap[it.id];
      const short = Math.abs(Math.min(s.projectedAll, s.availableNow));
      const drivers = store.deals.filter(d=>(d.status==='open'||(d.status==='won'&&!d.fulfilled)) && dealQtyFor(d,it.id)>0)
        .map(d=>`<a class="lnk" onclick="App.go('deal','${d.id}')">${esc(d.name)}</a> (${dealQtyFor(d,it.id)} ${esc(it.unit)}${d.status==='won'?', won':''})`);
      return `<div style="font-family:'Segoe UI',sans-serif;font-size:13.5px;margin-bottom:12px">
        <b>${esc(it.name)}</b> — you would be <b style="color:var(--red)">${short} ${esc(it.unit)} short</b>
        if all open deals close${s.incoming?` (even after ${s.incoming} ${esc(it.unit)} incoming)`:''}.
        Order at least <b>${orderQtyAdvice(it, short)} ${esc(it.unit)}</b> more${it.supplier?` from ${esc(it.supplier)}`:''}${
          (()=>{
            if(it.leadTimeDays==null) return '';
            const by = orderByDate(it);
            if(by) return by < todayISO()
              ? ` — <b style="color:var(--red)">that order is already late</b>: it's needed by ${fdate(neededBy(it))} and takes ${it.leadTimeDays} days, so it should have gone on ${fdate(by)}`
              : ` — needed by ${fdate(neededBy(it))}, so at ${it.leadTimeDays} days' lead time <b>place that order by ${fdate(by)}</b>`;
            return ` — at ${it.leadTimeDays} days' lead time, an order placed today lands about <b>${fdate(addDaysISO(todayISO(), it.leadTimeDays))}</b>`;
          })()}.
        <div style="color:var(--muted);margin-top:3px">Driven by: ${drivers.join(' · ')||'—'}</div>
      </div>`;
    }).join('')}
  </div>`:''}
  ${(!shortfalls.length && needsDeliveries.length)? `<div class="banner">
    <b>Watch:</b> ${needsDeliveries.map(it=>esc(it.name)).join(', ')} ${needsDeliveries.length===1?'is':'are'} only covered once pending deliveries arrive — chase those delivery dates.</div>`:''}

  <div class="card" style="padding:0;margin-bottom:16px">
    <table>
      <thead><tr><th>Product</th><th>Unit / pack</th><th>On hand</th><th>Committed (won)</th><th>Available now</th><th>Pipeline demand</th><th>Incoming</th><th>If all deals close</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>

  <div class="card">
    <div class="section-title">Incoming deliveries</div>
    ${pendingAll.length? `<table>
      <thead><tr><th>Product</th><th>Quantity</th><th>Expected</th><th>Supplier / ref</th><th></th></tr></thead>
      <tbody>${pendingAll.map(o=>{
        const it = stockItemById(o.itemId);
        const overdue = o.expectedDate && o.expectedDate < new Date().toISOString().slice(0,10);
        return `<tr>
          <td><b>${it?esc(it.name):'?'}</b></td>
          <td>+${o.qty} ${it?esc(it.unit):''}</td>
          <td>${fdate(o.expectedDate)} ${overdue?'<span class="pill red">overdue</span>':''}</td>
          <td>${esc(o.supplier)||'—'}</td>
          <td style="text-align:right">
            <button class="btn small" onclick="App.receiveIncoming('${o.id}')">Mark received</button>
            <button class="btn small ghost" onclick="App.deleteIncoming('${o.id}')">Remove</button>
          </td></tr>`;
      }).join('')}</tbody></table>`
    : '<div style="color:var(--muted);font-size:13px;font-family:sans-serif">No deliveries on the way. Log one when you place an order with your supplier.</div>'}
    ${receivedRecent.length? `<div style="margin-top:14px;font-family:'Segoe UI',sans-serif;font-size:12px;color:var(--muted)">
      Recently received: ${receivedRecent.map(o=>{const it=stockItemById(o.itemId);return '+'+o.qty+' '+(it?esc(it.name):'?')+' ('+fdate(o.receivedAt)+')';}).join(' · ')}</div>`:''}
  </div>`;
}

/* Recalculates every live figure on the Pricing tab. Pure read — never writes to the store. */
function refreshPricing(){
  const it = stockItemById(pricingSel); if(!it || !$('#pr_cost')) return;
  const cost   = Number($('#pr_cost').value)||0;
  const other  = it.costIsLanded ? 0 : (Number($('#pr_other').value)||0);
  const price  = Number($('#pr_price').value)||0;
  const vol    = Number($('#pr_vol').value)||0;
  const landed = cost + other;
  const gpUnit = price - landed;
  const pct    = marginPct(landed, price);
  const markup = landed ? (gpUnit/landed*100) : 0;
  const col    = gpUnit < 0 ? 'var(--red)' : 'var(--green-dark)';

  $('#pr_costVal').textContent  = fmtMoney(cost);
  if($('#pr_otherVal')) $('#pr_otherVal').textContent = fmtMoney(other);
  $('#pr_priceVal').textContent = fmtMoney(price);
  $('#pr_volVal').textContent   = vol + ' ' + it.unit;

  const savedPrice = it.tradePrice!=null ? it.tradePrice : 0;
  const diff = price - savedPrice;
  $('#pr_priceNote').innerHTML =
    `Break-even at ${fmtMoney(landed)}` +
    (savedPrice ? ` &nbsp;·&nbsp; saved price ${fmtMoney(savedPrice)}${
      Math.abs(diff) >= 0.005 ? ` (<span style="color:${diff<0?'var(--red)':'var(--green-dark)'}">${diff>0?'+':''}${fmtMoney(diff)}</span>)` : ''}` : '');

  $('#pr_figs').innerHTML = `
    <div class="pr-fig"><div class="lbl">Margin per ${esc(unitSingular(it.unit))}</div>
      <div class="val" style="color:${col}">${fmtMoney(gpUnit)}</div></div>
    <div class="pr-fig"><div class="lbl">Gross margin</div>
      <div class="val" style="color:${col}">${pct.toFixed(1)}%</div></div>
    <div class="pr-fig"><div class="lbl">Markup on cost</div>
      <div class="val">${landed ? markup.toFixed(1)+'%' : '—'}</div></div>
    <div class="pr-fig"><div class="lbl">Landed cost</div>
      <div class="val">${fmtMoney(landed)}</div>
      <div class="note">${other ? fmtMoney(cost)+' + '+fmtMoney(other)+' costs' : 'cost price only'}</div></div>
    <div class="pr-fig wide"><div class="lbl">On ${vol} ${esc(it.unit)}</div>
      <div class="val" style="color:${col}">${fmtMoney(gpUnit*vol)}</div>
      <div class="note">revenue ${fmtMoney(price*vol)} · cost ${fmtMoney(landed*vol)}</div></div>`;

  $('#pr_chart').innerHTML = svgMarginCurve(landed, price, Number($('#pr_price').max));
  if($('#pr_up')) refreshRangeSim();
  $('#pr_saveNote').textContent = 'Saves cost'
    + (it.costIsLanded ? '' : ', other costs') + ' and trade price. Volume is not saved.';
}

/* Margin % plotted against trade price, with break-even and the current position marked */
function svgMarginCurve(landed, price, maxPrice){
  const W=420, H=180, padL=34, padR=10, padT=12, padB=24;
  const x = p => padL + (p/maxPrice) * (W-padL-padR);
  const y = m => padT + (1 - (m+100)/200) * (H-padT-padB);   // margin scale -100%..+100%
  let d = '';
  for(let i=0;i<=120;i++){
    const p = maxPrice * (i/120);
    const m = Math.max(-100, Math.min(100, marginPct(landed, p)));
    d += (i? 'L':'M') + x(p).toFixed(1) + ',' + y(m).toFixed(1);
  }
  const curM = Math.max(-100, Math.min(100, marginPct(landed, price)));
  const grid = [-100,-50,0,50,100].map(m=>
    `<line x1="${padL}" y1="${y(m)}" x2="${W-padR}" y2="${y(m)}" stroke="${m===0?'#c9c2b2':'#eeebe2'}"/>
     <text x="${padL-5}" y="${y(m)+3.5}" text-anchor="end" font-size="9" fill="#6b7a70" font-family="Segoe UI">${m}%</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
    ${grid}
    <line x1="${x(landed)}" y1="${padT}" x2="${x(landed)}" y2="${H-padB}" stroke="#b03a2e" stroke-dasharray="3,3"/>
    <text x="${x(landed)+4}" y="${padT+9}" font-size="9" fill="#b03a2e" font-family="Segoe UI">break-even</text>
    <path d="${d}" fill="none" stroke="#1e5c40" stroke-width="2"/>
    <circle cx="${x(price)}" cy="${y(curM)}" r="4.5" fill="#d98324" stroke="#fff" stroke-width="1.5"/>
    <text x="${W-padR}" y="${H-6}" text-anchor="end" font-size="9" fill="#6b7a70" font-family="Segoe UI">trade price →</text>
  </svg>`;
}

/* Whole-range view: worst margins first, plus a supplier-increase simulation */
function renderPricingRange(){
  const priced = store.stock.items.filter(it=>landedCost(it)!=null && it.tradePrice!=null && it.tradePrice>0);
  if(!priced.length) return `<div class="card"><div class="section-title">Margin across the range</div>
    <div style="color:var(--muted);font-size:13px;font-family:sans-serif">
      Set a cost price and trade price on your products to compare their margins here.</div></div>`;

  const rows = priced
    .map(it=>({it, landed:landedCost(it), pct:marginPct(landedCost(it), it.tradePrice)}))
    .sort((a,b)=>a.pct-b.pct);

  return `
  <div class="card">
    <div class="section-title">Margin across the range — weakest first</div>
    <div class="frow" style="max-width:520px;margin-bottom:12px">
      <label>Simulate a supplier cost increase: <b id="pr_upVal">0%</b></label>
      <input type="range" id="pr_up" min="0" max="50" step="1" value="0" oninput="refreshRangeSim()">
      <div class="hint">Shows what an across-the-board cost rise does to each line, at today's trade prices.</div>
    </div>
    <div id="pr_blended" style="font-family:'Segoe UI',sans-serif;font-size:13.5px;margin-bottom:12px"></div>
    <table>
      <thead><tr><th>Product</th><th>Landed cost</th><th>Trade price</th><th>Margin</th><th style="width:180px"></th></tr></thead>
      <tbody id="pr_rangeRows">${rows.map(r=>pricingRangeRow(r, 0)).join('')}</tbody>
    </table>
  </div>`;
}
function pricingRangeRow(r, uplift){
  const landed = r.landed * (1 + uplift/100);
  const pct = marginPct(landed, r.it.tradePrice);
  const col = pct < 0 ? 'var(--red)' : (pct < 15 ? 'var(--amber)' : 'var(--green-dark)');
  const w = Math.max(0, Math.min(100, pct));
  return `<tr>
    <td><b>${esc(r.it.name)}</b>${r.it.costIsLanded?'<div style="font-size:11px;color:var(--muted)">landed cost</div>':''}</td>
    <td>${fmtMoney(landed)}${uplift?`<div style="font-size:11px;color:var(--amber)">+${uplift}%</div>`:''}</td>
    <td>${fmtMoney(r.it.tradePrice)}</td>
    <td style="color:${col};font-weight:700">${pct.toFixed(1)}%</td>
    <td><div style="background:#eeebe2;border-radius:5px;height:9px;overflow:hidden">
      <div style="width:${w}%;height:100%;background:${col}"></div></div></td>
  </tr>`;
}
function refreshRangeSim(){
  const up = Number($('#pr_up').value)||0;
  $('#pr_upVal').textContent = up + '%';
  const rows = store.stock.items
    .filter(it=>landedCost(it)!=null && it.tradePrice!=null && it.tradePrice>0)
    .map(it=>({it, landed:landedCost(it), pct:marginPct(landedCost(it), it.tradePrice)}))
    .sort((a,b)=>a.pct-b.pct);
  $('#pr_rangeRows').innerHTML = rows.map(r=>pricingRangeRow(r, up)).join('');
  const cost = rows.reduce((s,r)=>s + r.landed*(1+up/100), 0);
  const rev  = rows.reduce((s,r)=>s + r.it.tradePrice, 0);
  const pct  = marginPct(cost, rev);
  const loss = rows.filter(r=>marginPct(r.landed*(1+up/100), r.it.tradePrice) < 0).length;
  $('#pr_blended').innerHTML =
    `Blended margin across ${rows.length} product${rows.length===1?'':'s'}: <b>${pct.toFixed(1)}%</b>`
    + (loss? ` — <span style="color:var(--red);font-weight:600">${loss} line${loss===1?'':'s'} would sell at a loss</span>` : '');
}

/* ---------------- Reports ----------------
   Everything here is built from confirmed orders — real money, not pipeline. */
function renderReports(){
  const orders = store.orders.slice();
  if(!orders.length){
    return `
    <div class="page-head"><div><h2>Reports</h2>
      <div class="sub">Where the money actually came from.</div></div></div>
    <div class="card empty">
      <div class="big">&#128202;</div>
      <p><b>No orders yet.</b></p>
      <p style="margin-top:6px;max-width:520px;margin-left:auto;margin-right:auto">
        These reports are built from confirmed orders rather than the pipeline, so they show real
        revenue and margin. Save your first order and they'll fill in.</p>
      <button class="btn" style="margin-top:16px" onclick="App.go('orders')">Go to Orders</button>
    </div>`;
  }

  /* --- by customer --- */
  const byCo = {};
  orders.forEach(o=>{
    const co = companyById(o.companyId); if(!co) return;
    const m = orderMargin(o);
    const e = byCo[co.id] || (byCo[co.id] = {name:co.name, id:co.id, rev:0, cost:0, orders:0, last:'', known:true});
    e.rev += m.rev; e.cost += m.cost; e.orders++; if(!m.known) e.known = false;
    if((o.orderDate||'') > e.last) e.last = o.orderDate||'';
  });
  const customers = Object.values(byCo).sort((a,b)=>b.rev-a.rev);

  /* --- by product --- */
  const byItem = {};
  orders.forEach(o=>o.items.forEach(l=>{
    const it = stockItemById(l.itemId); if(!it) return;
    const c = landedCost(it);
    const e = byItem[it.id] || (byItem[it.id] = {name:it.name, unit:it.unit, qty:0, rev:0, cost:0, known:true});
    e.qty += l.qty; e.rev += l.qty*(l.unitPrice||0);
    if(c!=null) e.cost += l.qty*c; else e.known = false;
  }));
  const products = Object.values(byItem).sort((a,b)=>b.rev-a.rev);

  /* --- by month, last 12 --- */
  const months = [];
  const base = new Date(); base.setDate(1);
  for(let i=11;i>=0;i--){
    const dt = new Date(base.getFullYear(), base.getMonth()-i, 1);
    const k = monthKey(dt.toISOString());
    months.push({key:k, label:monthLabel(k),
      value: orders.filter(o=>o.orderDate && monthKey(o.orderDate)===k)
                   .reduce((s,o)=>s+orderTotal(o),0)});
  }

  /* --- quiet customers: ordered before, nothing recently --- */
  const QUIET_DAYS = 60;
  const quiet = customers
    .filter(c=>c.last && daysSince(c.last) > QUIET_DAYS)
    .map(c=>({...c, days: daysSince(c.last)}))
    .sort((a,b)=>b.rev-a.rev);

  const totalRev = customers.reduce((s,c)=>s+c.rev,0);
  const totalCost = customers.reduce((s,c)=>s+c.cost,0);
  const allKnown = customers.every(c=>c.known);
  const blended = marginPct(totalCost, totalRev);

  const bar = (v, max, col) => `<div style="background:#eeebe2;border-radius:5px;height:9px;overflow:hidden">
    <div style="width:${max?Math.max(1,Math.round(v/max*100)):0}%;height:100%;background:${col}"></div></div>`;
  const maxCoRev = customers.length ? customers[0].rev : 0;
  const maxItRev = products.length ? products[0].rev : 0;

  return `
  <div class="page-head">
    <div><h2>Reports</h2><div class="sub">Built from confirmed orders — real revenue and margin, not pipeline.</div></div>
  </div>

  <div class="grid kpis" style="margin-bottom:16px">
    <div class="card kpi"><div class="lbl">Revenue, all orders</div><div class="val">${fmtMoney(totalRev)}</div>
      <div class="note">${orders.length} order${orders.length===1?'':'s'}</div></div>
    <div class="card kpi"><div class="lbl">Gross margin</div>
      <div class="val" style="color:${blended<0?'var(--red)':'var(--green-dark)'}">${totalCost?blended.toFixed(1)+'%':'—'}</div>
      <div class="note">${totalCost?fmtMoney(totalRev-totalCost)+(allKnown?'':' · some costs missing'):'set cost prices to see this'}</div></div>
    <div class="card kpi"><div class="lbl">Customers ordering</div><div class="val">${customers.length}</div>
      <div class="note">avg ${fmtMoney(customers.length?totalRev/customers.length:0)} each</div></div>
    <div class="card kpi"><div class="lbl">Gone quiet</div>
      <div class="val" style="color:${quiet.length?'var(--amber)':'inherit'}">${quiet.length}</div>
      <div class="note">no order in ${QUIET_DAYS}+ days</div></div>
  </div>

  ${quiet.length? `<div class="card" style="margin-bottom:16px;border-left:4px solid var(--amber)">
    <div class="section-title" style="color:#8a5313">&#9200; Customers who've gone quiet</div>
    ${quiet.map(c=>`<div style="font-family:'Segoe UI',sans-serif;font-size:13.5px;margin-bottom:6px">
      <a class="lnk" onclick="App.go('company','${c.id}')"><b>${esc(c.name)}</b></a> — last ordered ${fdate(c.last)}
      (<b>${c.days} days</b> ago), worth ${fmtMoney(c.rev)} to you over ${c.orders} order${c.orders===1?'':'s'}.
    </div>`).join('')}
  </div>`:''}

  <div class="card" style="margin-bottom:16px">
    <div class="chart-title">Order value by month</div>
    ${svgBars(months.map(m=>({label:m.label, value:m.value})), '#1e5c40', true)}
  </div>

  <div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">
    <div class="card" style="padding:0">
      <div class="section-title" style="padding:16px 16px 0">Revenue by customer</div>
      <table>
        <thead><tr><th>Customer</th><th>Orders</th><th>Revenue</th><th>Margin</th><th style="width:100px"></th></tr></thead>
        <tbody>${customers.map(c=>{
          const pct = marginPct(c.cost, c.rev);
          return `<tr class="clickable" onclick="App.go('company','${c.id}')">
            <td><b>${esc(c.name)}</b><div style="font-size:11px;color:var(--muted)">last ${fdate(c.last)}</div></td>
            <td>${c.orders}</td>
            <td>${fmtMoney(c.rev)}</td>
            <td>${c.cost?`<span style="color:${pct<0?'var(--red)':'var(--green-dark)'}">${pct.toFixed(1)}%</span>${c.known?'':'*'}`:'—'}</td>
            <td>${bar(c.rev, maxCoRev, '#1e5c40')}</td></tr>`;
        }).join('')}</tbody>
      </table>
      ${allKnown?'':'<div style="padding:0 16px 14px;font-size:11.5px;color:var(--muted);font-family:sans-serif">* some products on these orders have no cost price set.</div>'}
    </div>

    <div class="card" style="padding:0">
      <div class="section-title" style="padding:16px 16px 0">Revenue by product</div>
      <table>
        <thead><tr><th>Product</th><th>Qty sold</th><th>Revenue</th><th>Margin</th><th style="width:100px"></th></tr></thead>
        <tbody>${products.map(pr=>{
          const pct = marginPct(pr.cost, pr.rev);
          return `<tr>
            <td><b>${esc(pr.name)}</b></td>
            <td>${pr.qty} ${esc(pr.unit)}</td>
            <td>${fmtMoney(pr.rev)}</td>
            <td>${pr.cost?`<span style="color:${pct<0?'var(--red)':'var(--green-dark)'}">${pct.toFixed(1)}%</span>${pr.known?'':'*'}`:'—'}</td>
            <td>${bar(pr.rev, maxItRev, '#d98324')}</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>
  </div>`;
}

/* ---------------- Invoices ---------------- */
function renderInvoices(){
  const invs = store.invoices.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const reminders = dueReminders();
  const unsent = invs.filter(i=>!i.sentAt && !i.paidAt);
  const outstanding = invs.filter(i=>i.sentAt && !i.paidAt);
  const overdue = outstanding.filter(i=>i.dueDate && i.dueDate < todayISO());
  const upcoming = outstanding.filter(i=>i.dueDate && i.dueDate >= todayISO() && i.dueDate <= addDaysISO(todayISO(),7));
  const outstandingTotal = outstanding.reduce((s,i)=>s+invoiceDue(i),0);
  const overdueTotal = overdue.reduce((s,i)=>s+invoiceDue(i),0);
  const nowKey = monthKey(new Date().toISOString());
  const paidThisMonth = invs.filter(i=>i.paidAt && monthKey(i.paidAt)===nowKey).reduce((s,i)=>s+invoiceDue(i),0);

  return `
  <div class="page-head">
    <div><h2>Invoices</h2>
    <div class="sub">Everything upcoming, due and outstanding. Invoices are created automatically when you save an order.</div></div>
  </div>

  ${reminders.length? `<div class="card" style="margin-bottom:16px;border-left:4px solid var(--amber)">
    <div class="section-title" style="color:#8a5313">&#9200; Reminders due</div>
    ${reminders.map(i=>{
      const co = companyById(i.companyId);
      return `<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:'Segoe UI',sans-serif;font-size:13.5px;margin-bottom:9px">
        <span>You asked to be reminded to send <b>${esc(i.number)}</b> (${fmtMoney(invoiceDue(i))}) to <b>${esc(co?co.name:'')}</b>.</span>
        <button class="btn small" onclick="App.openInvoiceView('${i.id}')">Send now</button>
        <button class="btn small ghost" onclick="App.snoozeReminder('${i.id}')">Snooze 24h</button>
      </div>`;
    }).join('')}
  </div>`:''}

  ${invs.length? `
  <div class="grid kpis" style="margin-bottom:16px">
    <div class="card kpi"><div class="lbl">Outstanding (sent, unpaid)</div><div class="val">${fmtMoney(outstandingTotal)}</div><div class="note">${outstanding.length} invoice${outstanding.length===1?'':'s'}</div></div>
    <div class="card kpi"><div class="lbl">Overdue</div><div class="val" style="color:${overdue.length?'var(--red)':'var(--green-dark)'}">${fmtMoney(overdueTotal)}</div><div class="note">${overdue.length} past due date</div></div>
    <div class="card kpi"><div class="lbl">Due in next 7 days</div><div class="val">${upcoming.length}</div></div>
    <div class="card kpi"><div class="lbl">Awaiting sending</div><div class="val" style="color:${unsent.length?'var(--amber)':'var(--green-dark)'}">${unsent.length}</div></div>
    <div class="card kpi"><div class="lbl">Paid this month</div><div class="val">${fmtMoney(paidThisMonth)}</div></div>
  </div>
  <div class="card" style="padding:0">
    <table>
      <thead><tr><th>Invoice</th><th>Order</th><th>Company</th><th>Amount</th><th>Issued</th><th>Due</th><th>Status</th><th></th></tr></thead>
      <tbody>${invs.map(i=>{
        const co = companyById(i.companyId);
        const o = orderById(i.orderId);
        const st = invStatus(i);
        return `<tr>
          <td><b>${esc(i.number)}</b></td>
          <td>${o?esc(o.ref||'Order'):'—'}</td>
          <td>${co?`<a class="lnk" onclick="App.go('company','${co.id}')">${esc(co.name)}</a>`:'—'}</td>
          <td><b>${fmtMoney(invoiceDue(i))}</b></td>
          <td>${fdate(i.issueDate)}</td>
          <td>${fdate(i.dueDate)}</td>
          <td><span class="pill ${st.cls}">${st.txt}</span></td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn small" onclick="App.openInvoiceView('${i.id}')">View / send</button>
            ${(!i.paidAt && i.sentAt)?`<button class="btn small ghost" onclick="App.markInvoicePaid('${i.id}')">Mark paid</button>`:''}
          </td></tr>`;
      }).join('')}</tbody>
    </table>
  </div>`
  : `<div class="card empty">
      <div class="big">&#129534;</div>
      <p><b>No invoices yet.</b></p>
      <p style="margin-top:6px;max-width:500px;margin-left:auto;margin-right:auto">
        Invoices are drafted automatically when you save a confirmed order in the <b>Orders</b> tab —
        you'll be offered the choice to send straight away or be reminded in 24 hours.</p>
      <button class="btn" style="margin-top:16px" onclick="App.go('orders')">Go to Orders</button>
    </div>`}
  <div class="banner" style="margin-top:16px">
    <b>How sending works:</b> "Send by email" opens your email app (e.g. Outlook) with the invoice pre-filled —
    press Send there. Use <b>Print &rarr; Save as PDF</b> to attach a formatted copy. When a customer pays,
    hit <b>Mark paid</b> so your outstanding figures stay accurate. Set your business details under
    <b>Settings &rarr; Invoice details</b>.

}

/* =====================================================================
   SVG CHART HELPERS (no external libraries)
   ===================================================================== */
function svgBars(items, color, money){
  if(!items.length) return '<div style="color:var(--muted);font-size:13px;font-family:sans-serif">No data yet.</div>';
  const W=480, H=190, pad=26, bw = (W-pad*2)/items.length;
  const max = Math.max(1, ...items.map(i=>Math.abs(i.value)));
  const zero = H-38; // baseline
  const scale = (zero-14)/max;
  let bars='';
  items.forEach((it,i)=>{
    const h = Math.abs(it.value)*scale;
    const x = pad + i*bw + bw*0.15, w = bw*0.7;
    const y = it.value>=0 ? zero-h : zero;
    bars += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,it.value===0?0:2)}" rx="4" fill="${it.value<0?'#b03a2e':color}"/>`;
    bars += `<text x="${x+w/2}" y="${H-20}" font-size="10.5" text-anchor="middle" fill="#6b7a70" font-family="Segoe UI">${esc(String(it.label).slice(0,11))}</text>`;
    if(it.value!==0) bars += `<text x="${x+w/2}" y="${(it.value>=0? y-5 : zero+h+12)}" font-size="10" text-anchor="middle" fill="#1e2a23" font-family="Segoe UI">${money?fmt(it.value):it.value}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><line x1="${pad}" y1="${zero}" x2="${W-pad}" y2="${zero}" stroke="#e2ded2"/>${bars}</svg>`;
}
function svgHBars(items){
  if(!items.length) return '';
  const W=900, rowH=34, H=items.length*rowH+10;
  const max = Math.max(1, ...items.map(i=>i.value));
  let rows='';
  items.forEach((it,i)=>{
    const y = 8+i*rowH;
    const w = Math.max(4,(it.value/max)*(W-330));
    rows += `<text x="0" y="${y+15}" font-size="12.5" fill="#1e2a23" font-family="Segoe UI">${esc(String(it.label).slice(0,34))}</text>
      <rect x="250" y="${y+2}" width="${w}" height="18" rx="5" fill="#1e5c40"/>
      <text x="${255+w}" y="${y+16}" font-size="12" fill="#6b7a70" font-family="Segoe UI">${fmt(it.value)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${rows}</svg>`;
}
function svgLine(items, color){
  if(!items.length) return '<div style="color:var(--muted);font-size:13px;font-family:sans-serif">No data yet.</div>';
  const W=480, H=190, pad=28;
  const max = Math.max(1, ...items.map(i=>i.value));
  const stepX = (W-pad*2)/Math.max(1,items.length-1);
  const y = v => (H-38) - (v/max)*(H-64);
  const pts = items.map((it,i)=> (pad+i*stepX)+','+y(it.value)).join(' ');
  let dots='', labels='';
  items.forEach((it,i)=>{
    const px = pad+i*stepX;
    dots += `<circle cx="${px}" cy="${y(it.value)}" r="4" fill="${color}"/>
      <text x="${px}" y="${y(it.value)-9}" font-size="10.5" text-anchor="middle" fill="#1e2a23" font-family="Segoe UI">${it.value||''}</text>`;
    labels += `<text x="${px}" y="${H-20}" font-size="10.5" text-anchor="middle" fill="#6b7a70" font-family="Segoe UI">${esc(it.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
    <line x1="${pad}" y1="${H-38}" x2="${W-pad}" y2="${H-38}" stroke="#e2ded2"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labels}</svg>`;
}
function svgDonut(segments){
  const total = segments.reduce((s,x)=>s+x.value,0);
  if(!total) return '<div style="color:var(--muted);font-size:13px;font-family:sans-serif">No data yet.</div>';
  const R=62, C=2*Math.PI*R;
  let off=0, circles='';
  segments.forEach(seg=>{
    if(!seg.value) return;
    const frac = seg.value/total;
    circles += `<circle r="${R}" cx="95" cy="95" fill="none" stroke="${seg.color}" stroke-width="26"
      stroke-dasharray="${frac*C} ${C}" stroke-dashoffset="${-off*C}" transform="rotate(-90 95 95)"/>`;
    off += frac;
  });
  const legend = segments.map(s=>`<span><span class="sw" style="background:${s.color}"></span>${esc(s.label)} (${s.value})</span>`).join('');
  return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <svg viewBox="0 0 190 190" style="width:170px">${circles}
      <text x="95" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e2a23" font-family="Georgia">${total}</text>
      <text x="95" y="110" text-anchor="middle" font-size="11" fill="#6b7a70" font-family="Segoe UI">deals</text></svg>
    <div class="legend" style="flex-direction:column;align-items:flex-start;gap:8px">${legend}</div></div>`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
primeSnapshots();          // baseline for change-stamping — must run before any save()
loadSyncCfg();             // picks up sync-config.json if published

if(getAuth() === null){ showLock(); }        // first run — offer password setup
else if(isUnlocked()){ showApp(); }
else { showLock(); }

// PWA: register service worker so the app installs on the desktop and works offline
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    const check = ()=>{ Promise.resolve().then(()=>reg.update()).catch(()=>{}); };
    check();                                        // check for a new build every launch
    setInterval(check, 15*60*1000);
    reg.addEventListener('updatefound', ()=>{
      const sw = reg.installing;
      if(!sw) return;
      sw.addEventListener('statechange', ()=>{
        // a new build has taken over — reload once so the user actually sees it
        if(sw.state==='activated' && navigator.serviceWorker.controller) location.reload();
      });
    });
  }).catch(()=>{});
}

// Auto-sync: on open, when you come back to the app, when you come online,
// and every 3 minutes while open (never more than once a minute).
if(syncToken()) setTimeout(()=>doSync(true), 800);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') autoSync(); });
window.addEventListener('online', autoSync);
setInterval(()=>{ if(document.visibilityState==='visible') autoSync(); }, 3*60*1000);
updateSyncUi(false);
</script>
